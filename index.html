<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>検査記録 - 甲種4類 過去問演習</title>
<style>
:root{
  box-sizing:border-box;
  --paper:#FFFFFF; --paper2:#F5F4F1; --ink:#211E19; --ink2:#5C574B;
  --line:#D8D3C6; --stamp:#B4222A; --stamp2:#7E1519; --gold:#B4892C;
  --ok:#1E8F52; --navy:#233F60; --mono: ui-monospace,'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;
  --sans: -apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* 常に白背景（端末のダークモード設定は反映しない） */
:root[data-theme="dark"]{
  --paper:#1A1713; --paper2:#241F19; --ink:#EDE8DD; --ink2:#B3AB99;
  --line:#463F33; --stamp:#E14B48; --stamp2:#F07470; --gold:#D9AE55;
  --ok:#57A87C; --navy:#6C8FBE;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100%;-webkit-tap-highlight-color:transparent;}
#app{max-width:560px;margin:0 auto;padding:0 16px 32px;}
.topbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;justify-content:space-between; margin:0 -16px 14px;}
.brand{font-size:13px;letter-spacing:.14em;color:var(--ink2);}
.brand b{color:var(--ink);font-size:15px;letter-spacing:.04em;}
.count-mono{font-family:var(--mono);font-size:13px;color:var(--ink2);}
h1{font-size:20px;margin:6px 0 2px;letter-spacing:.02em;}
h2{font-size:16px;margin:0 0 10px;color:var(--ink2);font-weight:600;}
.sub{color:var(--ink2);font-size:13px;margin:0 0 18px;}
.ledger{border-top:1px solid var(--ink);}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:none;border-right:none;width:100%;text-align:left;color:var(--ink);font-family:var(--sans);font-size:15px;}
.row:active{background:var(--paper2);}
.row .lbl{display:flex;flex-direction:column;gap:2px;}
.row .lbl small{font-size:11.5px;color:var(--ink2);font-weight:400;}
.badge{font-family:var(--mono);font-size:14px;min-width:34px;text-align:right;color:var(--ink2);}
.badge.on{color:var(--stamp);font-weight:700;}
.tag-star{color:var(--gold);}
.btn{display:block;width:100%;padding:15px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-size:15.5px;font-weight:700;letter-spacing:.03em;border-radius:2px;text-align:center;cursor:pointer;font-family:var(--sans);}
.btn:active{opacity:.85;}
.btn.ghost{background:transparent;color:var(--ink);}
.btn.line{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:500;}
.ticket{border:2px dashed var(--stamp);padding:16px;margin:18px 0;position:relative;background:var(--paper2);}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:14px;height:14px;background:var(--paper);border-radius:50%;transform:translateY(-50%);}
.ticket::before{left:-9px;} .ticket::after{right:-9px;}
.ticket h3{margin:0 0 6px;font-size:15px;color:var(--stamp2);}
.ticket p{margin:0 0 12px;font-size:13px;color:var(--ink2);}
.section-list .row small{margin-top:1px;}
.qwrap{padding-top:6px;}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-family:var(--mono);font-size:13px;color:var(--ink2);}
.timer{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ink);}
.timer.warn{color:var(--stamp);}
.qcard{border:1px solid var(--line);padding:16px 14px;background:var(--paper2);margin-bottom:14px;}
.qsec{font-size:11px;color:var(--ink2);letter-spacing:.06em;margin-bottom:6px;}
.qtext{font-size:16.5px;line-height:1.65;white-space:pre-wrap;}
.choices{margin-top:14px;}
.choice{display:flex;gap:10px;align-items:flex-start;padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer;}
.choice:last-child{border-bottom:none;}
.choice .num{flex:0 0 24px;height:24px;border:1.5px solid var(--ink2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;margin-top:1px;color:var(--ink2);}
.choice .txt{flex:1;font-size:15px;line-height:1.55;padding-top:1px;}
.choice.sel .num{border-color:var(--ink);background:var(--ink);color:var(--paper);}
.choice.correct{background:rgba(46,107,73,.14);}
.choice.correct .num{border-color:var(--ok);background:var(--ok);color:#fff;}
.choice.wrong{background:rgba(180,34,42,.12);}
.choice.wrong .num{border-color:var(--stamp);background:var(--stamp);color:#fff;}
.choice input[type=checkbox]{display:none;}
.stampwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:14px 0 2px;height:58px;overflow:visible;}
.stamp{width:92px;height:92px;border-radius:50%;border:5px solid var(--stamp);color:var(--stamp);display:flex;align-items:center;justify-content:center;font-size:21px;letter-spacing:-1px;font-weight:900;transform:scale(0) rotate(-14deg);opacity:0;transition:transform .32s cubic-bezier(.2,1.6,.4,1),opacity .2s;margin-top:-46px;background:var(--paper);box-shadow:0 2px 10px rgba(0,0,0,.08);}
.stamp.ok{border-color:var(--ok);color:var(--ok);box-shadow:0 2px 14px rgba(30,143,82,.22);}
.stamp.show{transform:scale(1) rotate(-8deg);opacity:1;}
.stampcaption{margin-top:8px;font-size:13.5px;font-weight:700;letter-spacing:.02em;color:var(--stamp2);opacity:0;transition:opacity .25s .18s;}
.stampcaption.show{opacity:1;}
.stampcaption.ok{color:var(--ok);}
.note{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;font-size:13.5px;color:var(--ink2);line-height:1.6;white-space:pre-wrap;}
.airow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.aibtn{flex:1 1 auto;min-width:96px;padding:10px 8px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);font-size:12.5px;font-weight:600;border-radius:4px;text-align:center;cursor:pointer;font-family:var(--sans);text-decoration:none;display:inline-block;}
.aibtn:active{background:var(--line);}
.aibtn.small{flex:none;min-width:0;padding:5px 10px;font-size:11.5px;font-weight:500;color:var(--ink2);margin-top:6px;}
.copyRevealBox{margin-top:8px;padding:9px;border:1px dashed var(--line);background:var(--paper2);border-radius:4px;}
.copyRevealLabel{font-size:11.5px;color:var(--ink2);margin-bottom:6px;line-height:1.5;}
.copyRevealTa{width:100%;min-height:120px;font-family:var(--mono);font-size:11.5px;padding:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:3px;}
.note b{color:var(--ink);}
.actionbar{position:sticky;bottom:0;background:var(--paper);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin:16px -16px 0;border-top:1px solid var(--line);}
.actionbar .inner{padding:0 16px;}
.resultscore{text-align:center;padding:22px 0 8px;}
.resultscore .num{font-family:var(--mono);font-size:52px;font-weight:800;line-height:1;}
.resultscore .num small{font-size:22px;color:var(--ink2);font-weight:500;}
.resultscore .cap{color:var(--ink2);font-size:13px;margin-top:6px;}
.misslist{margin:16px 0;}
.missitem{border:1px solid var(--line);padding:10px 12px;margin-bottom:8px;font-size:14px;cursor:pointer;}
.missitem .m1{font-size:12px;color:var(--stamp2);font-family:var(--mono);margin-bottom:3px;}
textarea{width:100%;min-height:150px;font-family:var(--mono);font-size:12.5px;padding:10px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:2px;}
.statbar{height:8px;background:var(--paper2);border:1px solid var(--line);margin-top:4px;overflow:hidden;}
.refhead{font-size:14.5px;font-weight:700;margin:24px 0 8px;color:var(--ink);border-left:4px solid var(--stamp);padding-left:9px;}
.refhead:first-of-type{margin-top:6px;}
.reftable{width:100%;border-collapse:collapse;margin:0 0 6px;font-size:13px;}
.reftable th,.reftable td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;line-height:1.5;}
.reftable th{background:var(--paper2);font-weight:700;font-size:12px;}
.refnote{font-size:12.5px;color:var(--ink2);margin:6px 0 4px;line-height:1.65;}
.statbar i{display:block;height:100%;background:var(--ink);}
.backlink{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink2);cursor:pointer;border-bottom:1px solid var(--line);padding-bottom:1px;}
.empty{padding:30px 4px;color:var(--ink2);font-size:14px;text-align:center;}
</style>
</head>

const __SELF_SRC = (document.currentScript && document.currentScript.textContent) || "";
/* ===================== データ ===================== */
const DATA = [
{"id":"s1-1","sec":"1. 消防法令上の定義","star":1,"q":"消防法令に定める「関係者」として、誤っているものは次のうちどれか。","ch":["防火対象物の管理者","消防対象物の所有者","防火対象物の防火管理者","消防対象物の占有者"],"ans":[3],"exp":"関係者は「所有者・管理者・占有者」の3者です。防火管理者はこれに含まれません。"},
{"id":"s1-2","sec":"1. 消防法令上の定義","star":0,"q":"無窓階の説明として、消防法令上、正しいものは次のうちどれか。","ch":["建築物の外壁に窓を有しない階","採光上又は排煙上有効な開口部を有しない階","排煙上又は消火活動上有効な窓が一定基準に達しない階","消火活動上有効な窓が一定基準に達しない階","消火活動上有効な窓を有しない階","避難上又は排煙上有効な開口部が一定基準に達しない階","窓を有しない階","避難上又は消火活動上有効な開口部を有しない階"],"ans":[8],"exp":"無窓階の定義は「避難上又は消火活動上有効な開口部を有しない階」です。"},
{"id":"s1-3","sec":"1. 消防法令上の定義","star":1,"q":"避難上又は消火活動上有効な開口部を有しない階（以下「無窓階」という。）と当該開口部の基準において、消防法令上、誤っているものは次のうちどれか。","ch":["床面から当該開口部の下端までの高さが1.2m以内であること。","当該開口部は、格子その他の内部から容易に避難することを妨げる構造を有しないものであり、かつ、外部から開放し、容易に破壊することにより進入できるものであること。","10階以下の防火対象物にあっては、当該開口部は、道又は道に通ずる幅員1m以上の通路その他の空地に面したものであること。","10階以下の防火対象物にあっては、無窓階とは、直径50cm以上の円が内接することができる開口部の面積の合計が、当該階の床面積の30分の1を超える階以外の階をいう。"],"ans":[4],"exp":"10階以下の防火対象物で無窓階とならないためには、「開口部の面積の合計が床面積の30分の1を超える」ことに加え、「直径1m以上の円が内接する開口部等（特例開口部）が2以上ある」ことが必要です。"},
{"id":"s1-4","sec":"1. 消防法令上の定義","star":0,"q":"規則に定める、避難上又は消火活動上有効な開口部を有しない階（以下「無窓階」という。）と当該開口部の基準として、正しいものは次のうちどれか。","ch":["11階以上の階の当該開口部は、道又は道に通ずる幅員1m以上の通路その他の空地に面したものであること。","高さ31mを超える階にあっては、直径50cm以上の円が内接することができる開口部の面積の合計が、当該階の床面積の30分の1を超える階以外の階をいう。","当該開口部は、格子その他の内部から容易に避難することを妨げる構造を有しないものであり、かつ、外部から開放し、又は容易に破壊することにより進入できるものであること。","床面から当該開口部の下端までの高さは、1.5m以内であること。"],"ans":[3],"exp":"当該開口部は「外部から開放し、又は容易に破壊することにより進入できる」必要があります。"},
{"id":"s1-5","sec":"1. 消防法令上の定義","star":0,"q":"消防法令に定められている用語の定義として、誤っているものを2つ選びなさい。","ch":["防火対象物とは、山林又は舟車、船きょ若しくはふ頭に繋留された船舶、建築物その他の工作物若しくはこれらに属する物をいう。","消防対象物とは、山林又は舟車、船きょ若しくはふ頭に繋留された船舶、建築物その他の工作物若しくはこれらに属する物をいう。","関係者とは、防火対象物又は消防対象物の所有者、管理者又は占有者をいう。","関係のある場所とは、防火対象物又は消防対象物のある場所をいう。","危険物とは、消防法別表第1の品名欄に掲げる物品で、同表に定める区分に応じ同表の性質欄に掲げる性状を有するものをいう。","舟車とは、船舶安全法第2条1項の規定を適用しない船舶、端舟、はしけ、被曳船その他の舟をいう。","複合用途防火対象物とは、防火対象物で政令で定める2以上の用途に供されるものをいう。"],"ans":[2,6],"exp":"2は消防対象物は「属する物」ではなく「物件」が正しいです（消防対象物の方が範囲が広い）。\n6の舟車の定義は「その他の舟及び車両」が正しく、「車両」が欠けているため誤りです。\n※選択肢1（防火対象物の定義）は法律上正しい記述です。","multi":1},
{"id":"s2-1","sec":"2. 消防法の基本","star":1,"q":"次の記述のうち、消防法令上、誤っているものはどれか。","ch":["消防用設備等とは、消防の用に供する設備、消防用水及び消火活動上必要な施設をいう。","防火対象物の関係者とは、防火対象物の所有者、管理者又は占有者をいう。","消防用設備等を設置することが義務付けられている防火対象物は、病院、旅館等不特定多数の者が出入りする防火対象物に限られる。","戸建て一般住宅については、消防用設備等の設置義務はない。"],"ans":[3],"exp":"消防用設備等の設置義務は、令別表第1に掲げる用途全般に及び、不特定多数の者が出入りする防火対象物に限られません。"},
{"id":"s2-2","sec":"2. 消防法の基本","star":1,"q":"消防用設備等に関する記述として、消防法令上、正しいものは次のうちどれか。","ch":["消防用設備等を設置することが義務付けられている防火対象物は、学校、病院及び旅館等の不特定多数の者が出入りする防火対象物に限られている。","戸建て一般住宅についても、一定の規模を超える場合、消防用設備等を設置しなければならない。","消防用設備等とは、消防の用に供する設備及び消火活動上必要な施設をいう。","政令で定める防火対象物の関係者は、政令で定める技術上の基準に従って消防用設備等を設置し、及び維持する義務がある。"],"ans":[4],"exp":"政令で定める防火対象物の関係者は、政令で定める技術上の基準に従って消防用設備等を設置し、及び維持する義務があります。"},
{"id":"s3-1","sec":"3. 防火対象物の区分","star":1,"q":"消防法令上、特定防火対象物に該当しないものは、次のうちどれか。","ch":["小学校","物品販売店舗","旅館","公衆浴場のうち、蒸気浴場、熱気浴場その他これらに類するもの"],"ans":[1],"exp":"小学校は非特定防火対象物です。"},
{"id":"s3-2","sec":"3. 防火対象物の区分","star":0,"q":"消防法令上、特定防火対象物に該当するものは、次のうちどれか。","ch":["小学校","共同住宅","百貨店","図書館"],"ans":[3],"exp":"百貨店は特定防火対象物です。"},
{"id":"s3-3","sec":"3. 防火対象物の区分","star":0,"q":"消防法令上、特定防火対象物に該当しないものは、次のうちどれか。","ch":["飲食店","映画館","テレビスタジオ","幼稚園"],"ans":[3],"exp":"テレビスタジオは非特定防火対象物です。"},
{"id":"s3-4","sec":"3. 防火対象物の区分","star":0,"q":"特定防火対象物の組合せとして、消防法令上、正しいものは次のうちどれか。","ch":["劇場、小学校及び幼稚園","公会堂、飲食店及び図書館","百貨店、ナイトクラブ及び工場","旅館、病院及びダンスホール"],"ans":[4],"exp":"旅館、病院、ダンスホールはいずれも特定防火対象物です。"},
{"id":"s3-5","sec":"3. 防火対象物の区分","star":0,"q":"消防法令上、特定防火対象物に該当しないものの組合せは、次のうちどれか。","ch":["飲食店及び料理店","公会堂及び集会場","老人デイサービスセンター及び更生施設","図書館及び美術館"],"ans":[4],"exp":"図書館及び美術館はいずれも非特定防火対象物です。"},
{"id":"s3-6","sec":"3. 防火対象物の区分","star":0,"q":"消防法令上、特定防火対象物に該当するものは、次のうちどれか。","ch":["図書館と事務所からなる高層ビル","蒸気浴場、熱気浴場その他これらに類する公衆浴場","テレビスタジオが併設された映画スタジオ","冷凍倉庫を含む作業場"],"ans":[2],"exp":"公衆浴場のうち、蒸気浴場、熱気浴場その他これらに類するもの（サウナ等）は特定防火対象物です。"},
{"id":"s4-1","sec":"4. 防火対象物の適用","star":0,"q":"消防用設備等の設置単位は原則として棟ごとであるが、同一棟内の部分でも別の防火対象物とみなされるものとして、消防法令上、正しいものは次のうちどれか。","ch":["耐火構造の建築物で、特定防火設備である防火戸又は壁で区画された部分。","耐火建築物又は準耐火建築物で、特定防火設備である防火戸及び耐火構造の床又は壁で区画された部分。","耐火建築物で、特定防火設備である防火戸及び耐火構造の床又は壁で区画された部分。","防火構造の床又は壁で区画され、開口部は特定防火設備である防火戸で区画された部分。","防火構造の床又は壁で区画され、かつ、開口部にはドレンチャー設備が設けられた部分。","開口部のない耐火構造の床又は壁で区画された部分。","開口部のない耐火構造の床及び特定防火設備である防火戸を有する壁で区画された部分。"],"ans":[6],"exp":"1〜5＆7. 「開口部のない耐火構造の床又は壁で区画」されていない部分は、一の防火対象物と見なされる。\n※ドレンチャー設備とは、建築物の外周に配置された複数のドレンチャーヘッドから水を放水して水幕を作り、飛散する火の粉やふく射熱から建築物を守る防火設備。\n※防火設備とは、建築基準法に規定されている建物内において延焼を防止するため（または延焼リスクの高い部分）に設けられる防火戸などを指す。「特定防火設備である防火戸」は、常時閉鎖型防火戸と随時閉鎖型防火戸がある。ただし、令8区画との関連はない。"},
{"id":"s4-2","sec":"4. 防火対象物の適用","star":0,"q":"消防用設備等を設置しなければならない防火対象物に関する説明として、消防法令上、誤っているものは次のうちどれか。","ch":["防火対象物が開口部のない耐火構造の床又は壁で区画されたときは、消防用設備等の設置について、その区画された部分をそれぞれ別の防火対象物とみなす。","複合用途防火対象物で同一の用途に供される部分は、消防用設備等の設置について、用途の管理者又は階に関係なく一の防火対象物とみなされる場合がある。","同一敷地内にある2以上の防火対象物で、外壁間の中心線からの水平距離が1階は3m以下、2階以上は5m以下で近接する場合、消防用設備等の設置について、1棟とみなされる。","特定防火対象物の地階で、地下街と一体をなすものとして消防長又は消防署長が指定したものは、消防用設備等の設置について、地下街の一部とみなされる場合がある。"],"ans":[3],"exp":"3. この場合、屋外消火栓設備の設置に関してのみ、一の建築物とみなす（令第19条2項）。すべての消防用設備等を対象としているわけではない。屋外消火栓設備では、建築物ごとに1階及び2階の床面積の合計が一定数値以上のものについて、設置しなければならない。\n（屋外消火栓設備に関する基準）\n第19条2項 同一敷地内にある2以上の令別表第1に掲げる建築物で、当該建築物相互の1階の外壁面の中心線からの水平距離が、1階にあっては3m以下、2階にあっては5m以下である部分を有するものは、屋外消火栓設備の設置の規定の適用については、一の建築物とみなす。"},
{"id":"s4-3","sec":"4. 防火対象物の適用","star":1,"q":"消防用設備等を設置する場合の防火対象物の基準について、消防法令上、正しいものは次のうちどれか。","ch":["防火対象物が開口部のない耐火構造の床又は壁で区画されているときは、それぞれ別の防火対象物とみなされる。","同一敷地内にある2以上の防火対象物は、原則として一の防火対象物とみなされる。","消防用設備等を設置することが義務付けられている防火対象物は、百貨店、病院、旅館等不特定多数の者が出入りする防火対象物に限られている。","戸建て一般住宅についても一定の規模を超える場合、消防用設備等の設置を義務付けられる場合がある。"],"ans":[1],"exp":"・同一敷地内に2以上の防火対象物があり、管理について権原を有する者が同一の者である場合は、一の防火対象物とみなされるが、単に同一敷地内にあるだけでは、それぞれ別の防火対象物となる。\n・消防用設備等の設置が義務付けられている防火対象物は、令別表第1に掲げる用途の防火対象物である。病院、旅館等不特定多数の者が出入りする防火対象物に限られているわけではない。\n・戸建て一般住宅は、その規模に関わらず「消防用設備等」を設置しなくてよい。ただし、「住宅用防災機器」を設置しなければならない。"},
{"id":"s4-4","sec":"4. 防火対象物の適用","star":0,"q":"消防用設備等の設置に関する説明として、消防法令上、正しいものは次のうちどれか。","ch":["防火対象物が開口部のない耐火構造の床又は壁で区画されているときは、それぞれ別の防火対象物とみなして消防用設備等を設置しなければならない。","防火対象物が耐火構造の壁で区画され、かつ、階層を異にするときは、それぞれ別の防火対象物とみなして消防用設備等を設置しなければならない。","複合用途防火対象物については、常にそれぞれ用途ごとに消防用設備等を設置しなければならない。","複合用途防火対象物については、主たる用途に適応する消防用設備等を設置しなければならない。"],"ans":[1],"exp":"2. この場合、「開口部のない耐火構造の床又は壁」で区画されていないことから、別の防火対象物とはみなされない。\n3＆4. 複合用途防火対象物については、原則として、それぞれの用途ごとに消防用設備等を設置しなくてはならない。ただし、特定の消防用設備等を設置する場合は、全体を一の防火対象物としてみなすことがある。また、複合用途の対象は令別表第1（1）〜（15）項に限られる（令第9条）。"},
{"id":"s4-5","sec":"4. 防火対象物の適用","star":0,"q":"1階が物品販売店舗、2階が料理店である防火対象物に消防用設備等を設置する場合について、消防法令上、正しいものは次のうちどれか。","ch":["1階と2階の管理者が別であれば、それぞれ別の防火対象物とみなす。","1階と2階が耐火構造の床又は壁で区画され、かつ、開口部に特定防火設備である防火戸が設けられていれば、それぞれ別の防火対象物とみなす。","階段部分を除き、1階と2階が耐火構造の床又は壁で区画されていれば、それぞれ別の防火対象物とみなす。","1階と2階が開口部のない耐火構造の床又は壁で区画されていれば、それぞれ別の防火対象物とみなす。"],"ans":[4],"exp":"設問の防火対象物は、特定用途を含む、一の複合用途防火対象物である。\n・複合用途防火対象物は、同一用途ごとに一の防火対象物とみなすが、1階、2階がそれぞれ別の用途に供されるため、それぞれ別の防火対象物とみなす。また、単に管理者が別という理由だけでは、それぞれ別の防火対象物とみなされない。\n・開口部があるため、それぞれ別の防火対象物とみなされない。\n・この場合、階段部分が開口部となる。"},
{"id":"s4-6","sec":"4. 防火対象物の適用","star":0,"q":"消防用設備等の設置及び維持に関する記述として、消防法令上、誤っているものは次のうちどれか。","ch":["市町村は、その地方の気候又は風土の特殊性により、消防用設備等の技術上の基準に関する政令又はこれに基づく命令の規定のみによっては防火の目的を充分に達しがたいと認めるときは、条例で当該規定と異なる規定を設けることができる。","政令別表第1（16）項に掲げる防火対象物の部分で、同表（16）項以外の防火対象物の用途のいずれかに該当する用途に供されるものは、消防用設備等の設置及び維持の技術上の基準の適用について、同一用途に供される部分を一の防火対象物とみなす。","防火対象物の構造の別を問わず、当該防火対象物が開口部のない耐火構造の床又は壁で区画されているときは、その区画された部分は、消防用設備等の設置及び維持の技術上の基準の適用について、それぞれ別の防火対象物とみなす。","政令別表第1に定める防火対象物以外の防火対象物については、消防法第17条第1項に規定する消防用設備等の設置義務はない。"],"ans":[2],"exp":"・「14. 消防用設備等の技術上の基準と異なる規定」参照。\n・例外として、「スプリンクラー設備、自動火災報知設備、ガス漏れ火災警報設備、漏電火災警報器等は、令第9条の適用を受けず、複合用途防火対象物として設置・維持しなければならない」。\n・令第8条の規定は、防火対象物の構造の別（耐火構造や準耐火構造など）は問わない。\n・「2. 消防法の基本」参照。"},
{"id":"s4-7","sec":"4. 防火対象物の適用","star":0,"q":"消防用設備等を設置しなければならない防火対象物の説明について、消防法令上、誤っているものは次のうちどれか。","ch":["防火対象物が、開口部のない耐火構造の床又は壁で区画されているときの消防用設備等の設置及び維持の技術上の基準の適用については、それぞれ別の防火対象物とみなされる。","一の用途が他の用途の従属的な部分と認められるときにあっては、その主たる用途の防火対象物として消防用設備等を設置しなければならない。","複合用途防火対象物で同一の用途に供される部分は、一定の消防用設備等を除き、用途の管理者又は階に関係なく、一の防火対象物とみなされる。","防火対象物が耐火構造の壁等で区画されているときは、開口部の有無に関係なく、それぞれ別の防火対象物とみなされる。"],"ans":[4],"exp":"2. 令第1条の2 2項。\n3. 令第9条。\n4. 原則、「防火対象物が、開口部のない耐火構造の床又は壁で区画されているとき」にそれぞれ別の防火対象物とみなされる。"},
{"id":"s1-5-1","sec":"5. 消防用設備等の種類","star":0,"q":"消防法令上、一定の防火対象物の関係者は、消防用設備等を設置し、維持することが義務付けられているが、これに関する説明として、正しいものは次のうちどれか。","ch":["消防用設備等を設置することが義務付けられている防火対象物は、百貨店、病院、旅館等の不特定多数の者が出入りする防火対象物に限られる。","一戸建ての住宅についても、一定の規模を超える場合、消防用設備等を設置しなければならない。","防火対象物の関係者とは、防火対象物の所有者、管理者又は占有者をいう。この関係者で権原を有するものが、設置し維持すべきことに対する命令に違反した場合、処罰の対象となる。","消防用設備等とは、消防の用に供する設備、消防用水及び消火活動上必要な施設をいい、水バケツはこれに含まれない。"],"ans":[3],"exp":"・消防用設備等の設置が義務付けられている防火対象物は、令別表第1に掲げる用途の防火対象物である。病院、旅館等不特定多数の者が出入りする防火対象物に限られているわけではない。「3. 防火対象物の区分」17P参照。\n・戸建て一般住宅は、その規模に関わらず「消防用設備等」を設置しなくてよい。ただし、「住宅用防災機器」を設置しなければならない。「2. 消防法の基本」15P参照。\n・消防長又は消防署長は、防火対象物の関係者で権原を有する者に対し、消防用設備等の設置維持命令を出すことができる（法第17条の4）。この命令の違反者は、1年以下の拘禁刑又は100万円以下の罰金に処せられる（法第41条1項5号）。\n・水バケツ、水槽、乾燥砂、膨張ひる石または膨張真珠岩は、簡易消火用具として「消防の用に供する設備」の消火設備に含まれる。"},
{"id":"s1-5-2","sec":"5. 消防用設備等の種類","star":0,"q":"消防用設備等の設置及び維持に関する説明として、消防法令上、正しいものは次のうちどれか。","ch":["消防用設備等を政令で定める技術上の基準に従って設置し、及び維持することが義務付けられているのは、防火対象物の所有者ではなく、防火管理者である。","消防用設備等とは、政令で定める消防の用に供する設備、消防用水及び消火活動上必要な施設をいう。","消防用設備等を設置することが義務付けられている防火対象物は、百貨店、病院、ホテル等の特定防火対象物に限られる。","防火対象物とは、山林又は舟車、船きょ若しくはふ頭に繋留された船舶、建築物その他の工作物又は物件をいう。","市町村は、その地方の気候または風土の特殊性により、消防用設備等の技術上の基準に関する政令またはこれに基づく命令の規定のみによっては防火の目的を十分に達し難いと認めるときは、条例で当該規定を緩和する規定を設けることができる。"],"ans":[2],"exp":"・消防用設備等の設置・維持が義務付けられているのは、防火対象物の関係者（所有者など）で、防火管理者ではない。「2. 消防法の基本」15P参照。\n・消防用設備等の設置が義務付けられている防火対象物は、令別表第1（16P参照）に掲げる用途の防火対象物である。特定防火対象物に限られているわけではない。「3. 防火対象物の区分」17P参照。\n・防火対象物とは、山林又は舟車、船きょ若しくはふ頭に繋留された船舶、建築物その他の工作物若しくはこれらに属する物をいう。設問の内容は「消防対象物」。「1. 消防法令上の定義」10P参照。\n・条例で当該規定を緩和する規定を設けることはできない。「14. 消防用設備等の技術上の基準と異なる規定」69P参照。"},
{"id":"s1-5-3","sec":"5. 消防用設備等の種類","star":1,"q":"消防法令に定められている用語の定義又は説明として、誤っているものを2つ答えなさい。","ch":["消防の用に供する設備……消火設備、警報設備及び避難設備をいう。","消防の用に供する設備……消火設備、警報設備及び消火水槽をいう。","消火活動上必要な施設……排煙設備、連結散水設備及び動力消防ポンプ設備をいう。","消火活動上必要な施設……排煙設備、連結散水設備、連結送水管、非常コンセント設備及び無線通信補助設備をいう。","防火対象物の関係者……防火対象物の所有者、管理者又は占有者をいう。","複合用途防火対象物……政令で定める2以上の用途に供される防火対象物をいう。"],"ans":[2,3],"exp":"2. 消防の用に供する設備は、消火設備・警報設備および避難設備をいう。消火水槽は消火設備に含まれる。\n3. 動力消防ポンプ設備は、「消防の用に供する設備」の消火設備に含まれる。","multi":1},
{"id":"s1-5-4","sec":"5. 消防用設備等の種類","star":1,"q":"消防用設備等の種類について、消防法令上、誤っているものは次のうちどれか。","ch":["動力消防ポンプ設備は、スプリンクラー設備と同じく、消火設備に含まれる。","自動火災報知設備は、非常警報設備と同じく、警報設備に含まれる。","避難橋は、すべり台や誘導灯と同じく、避難設備に含まれる。","消防機関へ通報する火災報知設備は、無線通信補助設備と同じく、消火活動上必要な施設に含まれる。"],"ans":[4],"exp":"3. 「避難橋」は、建築物相互を連絡する橋状のもの（避難器具の基準第二）をいい、避難設備に含まれる。\n4. 「消火活動上必要な施設」は、排煙設備、連結散水設備、連結送水管、非常コンセント設備及び無線通信補助設備をいう。消防機関へ通報する火災報知設備は、「消防の用に供する設備」の警報設備に含まれる。"},
{"id":"s1-5-5","sec":"5. 消防用設備等の種類","star":0,"q":"消防用設備等の種類について、消防法令上、誤っているものは次のうちどれか。","ch":["屋内消火栓設備は、スプリンクラー設備と同じく、消火設備に含まれる。","連結送水管は、消火器と同じく、消火設備に含まれる。","避難橋は、すべり台や誘導灯と同じく、避難設備に含まれる。","漏電火災警報器は、非常警報設備と同じく、警報設備に含まれる。"],"ans":[2],"exp":"2. 連結送水管は、「消火活動上必要な施設」に含まれる。"},
{"id":"s1-5-6","sec":"5. 消防用設備等の種類","star":1,"q":"消防法令上、「警報設備」に含まれないものは、次のうちどれか。","ch":["消防機関へ通報する火災報知設備","手動式サイレン","放送設備","無線通信補助設備"],"ans":[4],"exp":"4. 無線通信補助設備は、「消火活動上必要な施設」に含まれる。"},
{"id":"s1-6-1","sec":"6. 既存防火対象物に対する適用除外","star":1,"q":"消防用設備等の技術上の基準に関する政令若しくはこれに基づく命令の規定が改正されたとき、改正後の規定に適合させなければならない消防用設備等として、消防法令上、正しいものは次のうちどれか。","ch":["工場に設置されている屋内消火栓設備","展示場に設置されている自動火災報知設備","ラック式倉庫に設置されているスプリンクラー設備","図書館の蔵書室に設置されている窒素を放射する不活性ガス消火設備"],"ans":[2],"exp":"2. 展示場は、令別表第1の（4）に該当し、特定防火対象物となる。「③自動火災報知設備（特定防火対象物などに設けるものに限る）」に該当するため、消防用設備等の技術上の基準について、従前の規定は適用されない。規定が改正されるごとに、新規定に適合させなければならない。"},
{"id":"s1-6-2","sec":"6. 既存防火対象物に対する適用除外","star":0,"q":"用途が事務所である防火対象物において、消防用設備等の技術上の基準に関する政令若しくはこれに基づく命令の規定が改正されたとき、改正後の規定に適合させなければならない消防用設備等として、消防法令上、誤っているものは次のうちどれか。ただし、防火対象物の構造、用途、規模の変更等はないものとする。","ch":["消火器","避難器具","屋内消火栓設備","誘導灯"],"ans":[3],"exp":"従前の規定が適用されない消防用設備等は、消火器、避難器具、誘導灯である。これらは、技術上の基準に関する政令が改正されるごとに、改正後の規定に適合させなければならない。一方、屋内消火栓設備は、従前の規定がそのまま適用されるため、改正があってもそのまま使用を続けることができる。"},
{"id":"s1-6-3","sec":"6. 既存防火対象物に対する適用除外","star":0,"q":"消防用設備等の技術上の基準に関する政令若しくはこれに基づく命令の規定が改正されたとき、改正後の規定に適合させなければならない消防用設備等として、消防法令上、正しいものは次のうちどれか。ただし、防火対象物の構造、用途、規模の変更等はないものとする。","ch":["スプリンクラー設備","動力消防ポンプ設備","非常警報設備","排煙設備"],"ans":[3],"exp":""},
{"id":"s1-6-4","sec":"6. 既存防火対象物に対する適用除外","star":0,"q":"既存の特定防火対象物以外の防火対象物を消防用設備等（消火器、避難器具等を除く。）の技術上の基準が改正された後に増築した場合、消防用設備等を改正後の基準に適合させなければならないものとして、消防法令上、正しいものは次のうちどれか。ただし、当該消防用設備等は従前の規定に適合しているものとする。","ch":["増築部分の床面積の合計が、500m²を超え、かつ、増築前の延べ面積の1/3以上である場合","増築部分の床面積の合計が、500m²以上であるか、又は増築前の延べ面積の1/3以上である場合","増築部分の床面積の合計が、1,000m²を超え、かつ、増築前の延べ面積の1/2以上である場合","増築部分の床面積の合計が、1,000m²以上であるか、又は増築前の延べ面積の1/2以上である場合"],"ans":[4],"exp":""},
{"id":"s1-6-5","sec":"6. 既存防火対象物に対する適用除外","star":0,"q":"既存の防火対象物を消防用設備等の技術上の基準が改正された後に増築又は改築した場合、消防用設備等を改正後の基準に適合させなければならない増築又は改築の規模として、消防法令上、正しいものは次のうちどれか。","ch":["増築に係る当該防火対象物の部分の床面積の合計が、増築前の延べ面積の1/3となる場合","改築に係る当該防火対象物の部分の床面積の合計が、増築前の延べ面積の1/3となる場合","増築に係る当該防火対象物の部分の床面積の合計が、1,000m²となる場合","増築又は改築以前の当該防火対象物の延べ面積と、増築又は改築後の延べ面積との差が、500m²となる場合"],"ans":[3],"exp":"3. 増築又は改築に係る当該防火対象物の部分の床面積の合計が、1,000m²以上となる場合は、増築又は改築にあわせて、消防用設備等を改正後の基準に適合させなければならない。"},
{"id":"s1-6-6","sec":"6. 既存防火対象物に対する適用除外","star":0,"q":"既存の防火対象物を消防用設備等の技術上の基準が改正された後に増築、改築又は模様替えをした場合、消防用設備等を改正後の基準に適合させなければならない増築、改築又は模様替えに該当するものとして、消防法令上、正しいものは次のうちどれか。","ch":["延べ面積が1,000m²の倉庫を1,200m²に増築する。","延べ面積が1,500m²の工場のうち500m²を改築する。","延べ面積が2,000m²の遊技場の主要構造部である壁を2/3にわたって模様替えする。","延べ面積が2,500m²の劇場の主要構造部である壁を1/3にわたって修繕する。"],"ans":[3],"exp":"1＆2. 延べ面積の1/2以上の増改築に該当しないため、従前の規定が適用される。\n3. 改正後の基準に適合させなければならない「模様替え」に該当する。ただし、遊技場は特定防火対象物に該当するため、「模様替え」等にかかわらず、消防用設備等を改正後の基準に適合させなければならない。\n4. 劇場は特定防火対象物である。特定防火対象物は、増改築や修繕・模様替えにかかわらず、消防用設備等の技術上の基準が改正されるごとに消防用設備等を基準に適合させなければならない。設問では、消防用設備等を改正後の基準に適合させなければならない増改築、修繕・模様替えに該当するものを選ぶよう求めている。また、4の内容は「過半の修繕又は模様替え」に該当しない。"},
{"id":"s1-6-7","sec":"6. 既存防火対象物に対する適用除外","star":1,"q":"消防法令上、設備等技術基準の施行又は適用の際、現に存する防火対象物における消防用設備等（消火器、避難器具その他政令で定めるものを除く。）がこれらの規定に適合せず、当該規定が適用されていないとき、当該防火対象物を増築する場合、当該消防用設備等を当該規定に適合させなければならないものを3つ選びなさい。ただし、当該消防用設備等は、従前の規定に適合しているものとする。","ch":["基準時の延べ面積が1,000m²の工場を1,500m²に増築するもの","基準時の延べ面積が1,600m²の工場を2,500m²に増築するもの","基準時の延べ面積が1,500m²の倉庫を2,000m²に増築するもの","基準時の延べ面積が5,000m²の倉庫を6,000m²に増築するもの","基準時の延べ面積が2,500m²の図書館のうち、700m²を改築するもの","基準時の延べ面積が2,500m²の図書館を3,200m²に増築するもの","基準時の延べ面積が1,500m²の図書館を2,200m²に増築するもの","基準時の延べ面積が3,000m²の中学校のうち、800m²を改築するもの","基準時の延べ面積が3,000m²の中学校を3,800m²に増築するもの","基準時の延べ面積が2,000m²の事務所を2,900m²に増築するもの"],"ans":[1,2,4],"exp":"1＆2. この場合、「増築又は改築に係る防火対象物の部分の床面積の合計が、工事着手時における防火対象物の延べ面積の2分の1以上となるもの」に該当するため、増築にあわせて、消防用設備等を改正後の基準に適合させなければならない。\n4. 増築又は改築に係る当該防火対象物の部分の床面積の合計が、1,000m²以上となる場合は、増築又は改築にあわせて、消防用設備等を改正後の基準に適合させなければならない。","multi":1},
{"id":"s1-6-8","sec":"6. 既存防火対象物に対する適用除外","star":0,"q":"現に存する特定防火対象物以外の防火対象物における消防用設備等（消火器・避難器具その他政令で定めるものを除く。）に係る設備等技術基準が改正された後に、当該防火対象物の大規模の修繕又は模様替えを行った場合、当該消防用設備等を改正後の基準に適合させなければならない大規模の修繕又は模様替えとして、消防法令上、正しいものは次のうちどれか。ただし、当該消防用設備等は、従前の規定に適合しているものとする。","ch":["主要構造部である屋根及び柱について行う、それぞれ過半の修繕又は模様替え","主要構造部である床について行う、過半の修繕又は模様替え","主要構造部である壁について行う、過半の修繕又は模様替え","主要構造部である天井・床及び屋根について行う、それぞれ過半の修繕又は模様替え"],"ans":[3],"exp":"大規模の修繕及び模様替えは、当該防火対象物の主要構造部である壁について行う過半の修繕又は模様替えとする。"},
{"id":"s1-6-9","sec":"6. 既存防火対象物に対する適用除外","star":1,"q":"現に存する防火対象物における消防用設備等は、設備等に関する法令の改正があっても、原則として、改正前の基準に適合していればよいと規定されているが、法令の改正後に一定の「修繕」が行われた場合は、この規定は適用されず、改正後の基準に適合させなければならない。この一定の「修繕」に該当するものは、次のうちどれか。","ch":["主要構造部である柱を2分の1にわたって修繕したもの","主要構造部である床を2分の1にわたって修繕したもの","主要構造部である壁を3分の2にわたって修繕したもの","主要構造部である屋根を3分の2にわたって修繕したもの"],"ans":[3],"exp":""},
{"id":"s1-6-10","sec":"6. 既存防火対象物に対する適用除外","star":0,"q":"防火対象物の増築に関する記述について、文中の（　）に当てはまる数値として、消防法令上、正しいものは次のうちどれか。\n「設備等技術基準の施行又は適用の際、現に存する特定防火対象物以外の防火対象物における消防用設備等（消火器、避難器具その他政令で定めるものを除く。）がこれらの規定に適合せず、当該規定が適用されていないとき、当該防火対象物を増築する場合、基準時以後の増築部分の床面積の合計が、（　）m²以上となるものは、当該消防用設備等を当該規定に適合させなければならない。」","ch":["300","500","700","1,000"],"ans":[4],"exp":""},
{"id":"s1-7-1","sec":"7. 既存防火対象物の用途変更の特例","star":1,"q":"防火対象物の用途が変更された場合の消防用設備等の技術上の基準の適用について、消防法令上、正しいものは次のうちどれか。","ch":["防火対象物の用途が変更された場合は、変更後の用途に適合する消防用設備等を設置しなければならない。","変更後の用途が特定防火対象物に該当しなければ、すべての消防用設備等を変更しなくてよい。","変更後の用途が特定防火対象物に該当する場合は、変更後の用途区分に適合する消防用設備等を設置しなければならない。","用途変更前に設置された消防用設備等が違反していた場合は、変更前の基準に適合するよう措置しなければならない。"],"ans":[3],"exp":"1. 特例が設けられているため、変更前の用途に適合する消防用設備等で良い場合がある。\n2. 変更後の用途が特定防火対象物に該当しなくても、消防用設備等を技術上の基準（用途変更後の基準）に適合するように変更しなければならない場合がある。具体的には、①用途が変更される前の技術上の基準に適合していないとき、②用途変更後に一定規模以上の増築・改築等の工事に着手しているとき、などである。\n3. 正しい。\n4. この場合、用途変更後の基準に適合するよう措置しなければならない。"},
{"id":"s1-7-2","sec":"7. 既存防火対象物の用途変更の特例","star":0,"q":"防火対象物の用途変更と消防用設備等（消火器、避難器具その他政令で定めるものを除く。）の技術基準の関係について、消防法令上、正しいものは次のうちどれか。","ch":["消防用設備等が変更前の用途に係る技術基準に違反していた場合、変更後の用途に係る技術基準に従って設置しなければならない。","用途が変更された場合、いかなる用途の防火対象物であっても変更後の用途に係る技術基準に従い設置しなければならない。","用途が変更されて特定防火対象物になった場合、変更前の用途に係る技術基準に従って設置されていれば、変更後の用途基準に従って設置する必要はない。","用途が変更された後に、主要構造部である壁について過半の修繕を施した場合、変更前の用途に係る技術基準に従って設置されれば、変更後の用途に係る技術基準に従って設置する必要はない。"],"ans":[1],"exp":"1. 特例が適用されない例の①に該当（正しい）。\n2. 特例が設けられているため、変更前の用途に適合する消防用設備等で良い場合がある。\n3. 変更後の用途基準に従って設置する。特例が適用されない例の④に該当。\n4. 変更後の用途基準に従って設置する。特例が適用されない例の②に該当。"},
{"id":"s1-7-3","sec":"7. 既存防火対象物の用途変更の特例","star":0,"q":"防火対象物の用途が変更された場合の消防用設備等の技術上の基準の適用について、消防法令上、誤っているものは次のうちどれか。","ch":["原則として、用途変更前に設置された消防用設備等はそのままにしておいてよいが、その後、一定規模以上の増改築工事を行う場合は、変更後の用途区分に適合する消防用設備等を設置しなければならない。","用途変更前に設置された消防用設備等が用途変更前の基準に違反していた場合は、用途変更後の基準に適合する消防用設備等を設置しなければならない。","変更後の用途が特定防火対象物に該当する場合は、変更後の用途区分に適合する消防用設備等を設置しなければならない。","用途変更後、設置義務のなくなった消防用設備等については、撤去するなど確実に機能を停止させなければならない。","用途変更前に設置された適法な消防用設備等については、法令に定める場合を除き、変更する必要はない。"],"ans":[4],"exp":"1. 特例が適用されない例の②に該当。\n2. 特例が適用されない例の①に該当。\n3. 特例が適用されない例の④に該当。\n4. 不要となった消防用設備等の措置については、消防法では特に規定されていない。ただし、廃棄物等として法令（廃棄物処理法やリサイクル法）の適用を受ける。\n5. 特例が適用される内容である"},
{"id":"s1-8-1","sec":"8. 定期点検及び報告","star":1,"q":"消防用設備等の定期点検を消防設備士又は消防設備点検資格者にさせなければならない防火対象物として、消防法令上、次のうち正しいものはいくつあるか。ただし、いずれの防火対象物も消防長又は消防署長が火災予防上必要があると認めて指定するものではないものとする。\nA. 延べ面積にかかわらず、すべての防火対象物\nB. 延べ面積にかかわらず、すべての特定防火対象物\nC. 延べ面積が1,000m²以上の防火対象物\nD. 延べ面積が1,000m²以上の特定防火対象物\nE. 延べ面積が1,000m²以上の特定防火対象物以外の防火対象物\nF. 延べ面積が2,000m²以上の特定防火対象物以外の防火対象物","ch":["1つ","2つ","3つ","4つ"],"ans":[1],"exp":"正解：1（Dのみ）"},
{"id":"s1-8-2","sec":"8. 定期点検及び報告","star":0,"q":"消防設備士又は消防設備点検資格者に、消防用設備等を定期に点検させ、その結果を消防長又は消防署長に報告しなければならない防火対象物として、消防法令上、正しいものは次のうちどれか。","ch":["すべての高層建築物","キャバレーで、延べ面積が500m²のもの","病院で、延べ面積が1,000m²のもの","すべての旅館"],"ans":[3],"exp":"3. 病院、診療所、助産所は、令別表第1（6）イに該当し、特定防火対象物である。延べ面積が1,000㎡以上であるため、消防設備士又は消防設備点検資格者に定期点検及び報告をさせなければならない。"},
{"id":"s1-8-3","sec":"8. 定期点検及び報告","star":1,"q":"消防用設備等は定期的に点検し、その結果を一定期間ごとに消防長又は消防署長に報告しなければならないが、防火対象物の用途と報告の期間の組合せとして、消防法令上、正しいものを2つ選びなさい。","ch":["保育所 ………… 3年に1回","幼稚園 ………… 3年に1回","劇場 …………… 6か月に1回","物品販売店舗 … 1年に1回","養護老人ホーム … 1年に1回","小学校 ………… 1年に1回","百貨店 ………… 6か月に1回","駐車場 ………… 1年に1回"],"ans":[4,5],"exp":"定期点検の結果について、特定防火対象物は1年に1回、特定防火対象物以外の防火対象物は3年に1回、それぞれ報告しなければならない。\n・特定防火対象物…保育所、幼稚園、劇場、物品販売店舗、養護老人ホーム、百貨店\n・特定防火対象物以外の防火対象物…小学校、駐車場","multi":1},
{"id":"s1-8-4","sec":"8. 定期点検及び報告","star":1,"q":"消防用設備等の定期点検を消防設備士又は消防設備点検資格者にさせなければならない防火対象物として、消防法令上、正しいものを4つ選びなさい。ただし、いずれの防火対象物も消防長又は消防署長の指定を受けていないものとする。","ch":["キャバレーで、延べ面積が1,000m²のもの","駐車場で、延べ面積が1,500m²のもの","映画館で、延べ面積が700m²のもの","集会場で、延べ面積が1,000m²のもの","共同住宅で、延べ面積が2,000m²のもの","飲食店で、延べ面積が1,000m²のもの","飲食店で、延べ面積が300m²のもの","百貨店で、延べ面積が1,000m²のもの","旅館で、延べ面積が500m²のもの","ホテルで、延べ面積が500m²のもの","診療所で、延べ面積が500m²のもの","小学校で、延べ面積が1,000m²のもの","幼稚園で、延べ面積が800m²のもの","映画スタジオで、延べ面積が3,000m²のもの"],"ans":[1,4,6,8],"exp":"特定防火対象物で、延べ面積が1,000㎡以上のものは、消防設備士又は消防設備点検資格者に定期点検をさせなければならない。\n・特定防火対象物…キャバレー、映画館、集会場、飲食店、百貨店、旅館、ホテル、診療所、幼稚園\n・特定防火対象物以外の防火対象物…駐車場、共同住宅、小学校、映画スタジオ","multi":1},
{"id":"s1-8-5","sec":"8. 定期点検及び報告","star":0,"q":"消防用設備等の定期点検を消防設備士又は消防設備点検資格者にさせなければならない特定防火対象物の最小の延べ面積として、消防法令に定められているものは、次のうちどれか。","ch":["300m²","500m²","1,000m²","2,000m²"],"ans":[3],"exp":""},
{"id":"s1-8-6","sec":"8. 定期点検及び報告","star":1,"q":"消防用設備等の定期点検及び報告に関する記述について、消防法令上、誤っているものは次のうちどれか。ただし、総務省令で定める舟車を除く。","ch":["消防法第17条に基づいて設置された消防用設備等は、定期に点検をしなければならない。","特定防火対象物以外の防火対象物にあっては、点検を行った結果を維持台帳に記録し、消防長又は消防署長に報告を求められたときに報告すればよい。","特定防火対象物の関係者は、点検の結果を消防長又は消防署長に報告しなければならない。","延べ面積が1,000m²以上の特定防火対象物の消防用設備等にあっては、消防設備士又は消防設備点検資格者に点検をさせなければならない。"],"ans":[2],"exp":"1. 法第17条の3の3では、定期点検及び報告の対象を「当該防火対象物における消防用設備等」としている。このため、設問では「消防法第17条に基づいて設置された消防用設備等」という表現になっている。なお、任意に設置された消防用設備等については、一定期間ごとの点検及び結果報告に関する規定は適用されない。\n2. 特定防火対象物以外の防火対象物にあっては、消防用設備等を定期に点検し、点検の結果を維持台帳に記録するとともに、3年に1回、消防長又は消防署長に報告しなければならない。"},
{"id":"s1-8-7","sec":"8. 定期点検及び報告","star":0,"q":"消防用設備等の点検及び報告に関する記述として、消防法令上、正しいものは次のうちどれか。","ch":["消防用設備等の点検結果については、消防長又は消防署長から報告を求められたときに報告すればよい。","店舗に任意に設置された消防用設備等であっても一定期間ごとに点検し、その結果を報告しなければならない。","延べ面積が1,000m²以上の病院に設置された法令上設置義務のある消防用設備等の点検は、消防設備士又は消防設備点検資格者に行わせなければならない。","点検を行った消防設備士は、消防用設備等の点検結果について消防長又は消防署長に報告しなければならない。"],"ans":[3],"exp":"1. 消防用設備等の点検結果については、1年に1回又は3年に1回、消防長又は消防署長に報告しなければならない。\n2. 任意に設置された消防用設備等については、一定期間ごとの点検及び結果報告に関する規定は適用されない。\n4. 消防用設備等の点検結果について、消防長又は消防署長に報告しなければならないのは、防火対象物の関係者であり、点検を行った消防設備士ではない。"},
{"id":"s1-8-8","sec":"8. 定期点検及び報告","star":1,"q":"消防法第17条の3の3に基づく消防用設備等の点検及び報告について、消防法令上、誤っているものを3つ選びなさい。ただし、規則第31条の6第4項の規定に基づく、消防庁長官が定める事由により点検等の期間を延長する措置は考慮しないものとする。","ch":["特定防火対象物の関係者は、点検を行った結果を1年に1回、都道府県知事に報告しなければならない。","政令別表第1（20）項に掲げる舟車は、防火対象物であるが点検を行う義務はない。","防火対象物の関係者は、点検を行った結果を維持台帳に記録し、防火対象物の区分によって定められた期間ごとに、消防長又は消防署長に報告しなければならない。","防火対象物の関係者が、自ら消防用設備等の定期点検を行う防火対象物もある。","延べ面積が1,000m²以上の特定防火対象物の関係者は、消防設備士等の有資格者に消防用設備等の点検をさせなければならない。","延べ面積が1,000m²以上の特定防火対象物の消防用設備等の定期点検は、消防設備士の免状の交付を受けている者のみができる。","特定防火対象物以外の防火対象物の関係者は、延べ面積が300m²以上のもののうち消防長又は消防署長が火災予防上必要があると認めて指定するものは、消防設備士等の有資格者に点検させなければならない。"],"ans":[1,6,7],"exp":"1. 特定防火対象物の関係者は、点検を行った結果を1年に1回、「消防長又は消防署長」に報告しなければならない。\n6. 消防設備士の免状の交付を受けている者の他、消防設備点検資格者も定期点検を行うことができる。\n7. 「延べ面積が300㎡以上のもののうち」⇒「延べ面積が1,000㎡以上のもののうち」。","multi":1},
{"id":"s1-8-9","sec":"8. 定期点検及び報告","star":1,"q":"消防用設備等の定期点検及び報告に関する記述について、消防法令上、正しいものを2つ選びなさい。ただし、総務省令で定める舟車を除く。また、規則第31条の6第4項の規定に基づく消防庁長官の定める事由により、点検等の期間を延長する措置は考慮しないものとする。","ch":["すべての防火対象物に設置された消防用設備等の点検は、消防設備士又は消防設備点検資格者でなければ行うことはできない。","消防法第17条に基づいて設置された消防用設備等は、定期に点検をしなければならない。","消防設備士又は消防設備点検資格者は、点検した結果について、消防長又は消防署長に報告しなければならない。","特定防火対象物の消防用設備等については、すべて定期に点検し、その結果を都道府県知事に報告しなければならない。","定期点検の結果について報告をせず、又は虚偽の報告をした者は、30万円以下の罰金又は拘留に処せられることがある。"],"ans":[2,5],"exp":"1. 消防用設備等の点検は、消防設備士又は消防設備点検資格者でなければ行うことができないものと、消防設備士又は消防設備点検資格者以外の者でも行うことができるものとがある。\n2. 任意に設置された消防用設備等については、一定期間ごとの点検及び結果報告に関する規定は適用されないが、設問では「消防法第17条に基づいて設置された消防用設備等」であるため、定期点検をしなければならない。\n3. 消防用設備等の点検結果について、消防長又は消防署長に報告しなければならないのは、防火対象物の関係者であり、点検を行った消防設備士や消防設備点検資格者ではない。\n4. 点検の結果の報告先は、消防長又は消防署長である。","multi":1},
{"id":"s1-8-10","sec":"8. 定期点検及び報告","star":0,"q":"消防用設備等の定期の点検を消防設備士又は消防設備点検資格者に点検させなければならない防火対象物として、消防法令上、正しいものは次のうちどれか。ただし、すべて耐火構造、地階はなく階数3、延べ面積は300㎡とし、避難階は1階とする。また、いずれの防火対象物も、屋内階段は規則に定める避難上有効な構造を有しないものとし、消防用設備等又は特殊消防用設備等の防火安全性能を確保するために、消防設備士等による点検が特に必要であるものと規則に定める防火対象物には該当しないものとする。","ch":["避難階又は地上に直通する屋内階段が一で、1階及び2階がパチンコ店、3階が美容室の複合用途防火対象物","避難階又は地上に直通する屋外階段が一で、1階及び2階が学習塾、3階が喫茶店の複合用途防火対象物","避難階又は地上に直通する屋内階段が一のカラオケ店","避難階又は地上に直通する屋外階段が一のビジネスホテル"],"ans":[3],"exp":"1. 3階の美容室は令別表第1（15）に該当し、特定防火対象物ではないため特定一階段等防火対象物とはならない。このため消防設備士等による点検の対象とはならない。\n2＆4. 屋外階段であるため該当しない。\n※「規則に定める避難上有効な構造を有する階段」とは、建築基準法施行令に規定する避難階段（屋内に設けるもので消防庁長官が定める部分を有するものに限る。）又は特別避難階段をいう。"},
{"id":"s1-8-11","sec":"8. 定期点検及び報告","star":0,"q":"消防用設備等又は特殊消防用設備等の点検及び報告の期間に関する記述について、文中の（　）に当てはまる語句として、消防法令上、正しいものは次のうちどれか。ただし、（　）には同じ語句が入るものとする。\n「新型インフルエンザ等その他の（　）が定める事由により、これらの項に規定する期間ごとに法第17条の3の3の規定による点検を行い、又はその結果を報告することが困難であるときは、（　）が当該事由を勘案して定める期間ごとに当該点検を行い、又はその結果を報告するものとする。」","ch":["消防長又は消防署長","消防庁長官","総務大臣","都道府県知事"],"ans":[2],"exp":"全国的な災害やパンデミック等の事由により報告期間を延長する権限は「消防庁長官」にある。"},
{"id":"s1-8-12","sec":"8. 定期点検及び報告","star":0,"q":"消防用設備等の点検の結果について、消防法令上、消防長又は消防署長への報告期間が1年に1回と定められているものは次のうちどれか。ただし、規則第31条の6第4項の規定に基づく、消防庁長官が定める事由により、点検等の期間を延長する措置は考慮しないものとする。","ch":["防火構造で、延べ面積が300m²の飲食店","準耐火構造で、延べ面積が500m²の寺院","耐火構造で、延べ面積が1,000m²の寄宿舎","耐火構造で、延べ面積が1,500m²の博物館"],"ans":[1],"exp":"1. 特定防火対象物が1年に1回の報告となる。\n2〜4. 特定防火対象物以外の防火対象物のため、3年に1回の報告となる。"},
{"id":"s1-9-1","sec":"9. 防火対象物点検資格者","star":0,"q":"防火対象物点検資格者に関する記述について、文中の（　）に当てはまるものとして、消防法令上、正しいものは次のうちどれか。\n「消防設備士が防火対象物点検資格者になる条件の一つとして、消防用設備等の工事、整備又は点検について（　）年以上の実務経験が必要である。」","ch":["1","2","3","4"],"ans":[3],"exp":"消防設備士が防火対象物点検資格者になる要件として、「3年以上」の実務経験が定められている。"},
{"id":"s1-9-2","sec":"9. 防火対象物点検資格者","star":0,"q":"消防法令上、防火対象物点検資格者でなければ点検できない防火対象物は次のうちどれか。","ch":["防火対象物の管理について権原が分かれていない、防火管理者を定める必要のない特定防火対象物","防火対象物の管理について権原が分かれていない、防火管理者を定める必要のある特定防火対象物以外の防火対象物","防火対象物の管理について権原が分かれている、収容人員250人の特定防火対象物に該当する複合用途防火対象物","防火対象物の管理について権原が分かれていない、収容人員450人の特定防火対象物に該当する複合用途防火対象物"],"ans":[4],"exp":"法令では、「防火対象物の権原を有する者は、防火対象物点検資格者に点検させなければならない」と規定している。この内容から、「防火対象物点検資格者でなければ点検できない防火対象物」を判定することになる。\n3. 権原が分かれている場合、それぞれの権原を有する者は、防火対象物点検資格者に点検させなければならない。収容人員250人の特定用途の複合用途防火対象物は、収容人員が300人以上ではないため、「防火対象物点検資格者でなければ点検できない防火対象物」に該当しないことになる。"},
{"id":"s1-10-1","sec":"10. 消防用設備等の届出及び検査","star":0,"q":"消防用設備等の検査を行わなければならない防火対象物として、消防法令上、適切なものは次のうちどれか。ただし、消防長又は消防署長が指定するものを除く。","ch":["延べ面積 1,000m² の中学校","延べ面積 500m² のダンスホール","延べ面積 500m² の美術館","延べ面積 1,000m² の共同住宅"],"ans":[2],"exp":"2. ダンスホールは、延べ面積が300㎡以上のものが対象となる。\n1＆3＆4. 中学校、美術館及び共同住宅は、延べ面積が300㎡以上のもののうち、消防長又は消防署長が火災予防上必要があると認めて指定するものが対象となる。"},
{"id":"s1-10-2","sec":"10. 消防用設備等の届出及び検査","star":1,"q":"設備等技術基準に従って設置しなければならない消防用設備等（簡易消火用具及び非常警報器具を除く。）を設置した場合、消防長又は消防署長に届け出て、検査を受けなければならない防火対象物として、消防法令上、正しいものを2つ選びなさい。ただし、消防長又は消防署長が指定するものを除く。","ch":["延べ面積が 250m² の助産所（入所施設を有しない）","延べ面積が 250m² の集会場","延べ面積が 250m² の教会","延べ面積が 250m² のカラオケボックス","延べ面積が 500m² のナイトクラブ","延べ面積が 1,000m² の中学校","延べ面積が 500m² の美術館","延べ面積が 1,000m² の共同住宅"],"ans":[4,5],"exp":"1＆2＆5. 入所施設を有しない助産所、集会場及びナイトクラブは、延べ面積が300㎡以上のものが対象となる。\n3＆6〜8. 教会、中学校、美術館、共同住宅は、延べ面積が300㎡以上のもののうち、消防長又は消防署長が火災予防上必要があると認めて指定するものが対象となる。\n4. カラオケボックスは、延べ面積に関係なく対象となる。","multi":1},
{"id":"s1-10-3","sec":"10. 消防用設備等の届出及び検査","star":0,"q":"消防用設備等を設備等技術基準に従って設置した場合、消防機関の検査を受けなくてもよい防火対象物は次のうちどれか。ただし、防火対象物はすべて平家建で、非常警報器具及び簡易消火用具は設置されていないものとする。","ch":["延べ面積 200m² の老人短期入所施設","延べ面積 350m² の診療所","延べ面積 250m² の特別支援学校","延べ面積 500m² の演芸場"],"ans":[3],"exp":"1. 老人短期入所施設は、延べ面積にかかわらず消防用設備等の検査が必要となる。\n2. 診療所は、入院施設の有無で基準が異なってくるが、延べ面積が350㎡であるため、いずれであっても消防用設備等の検査が必要となる。\n3. 延べ面積が300㎡以上ではないため、消防用設備等の検査が不要となる。\n4. 延べ面積が300㎡以上であるため、消防用設備等の検査が必要となる。"},
{"id":"s1-10-4","sec":"10. 消防用設備等の届出及び検査","star":0,"q":"消防用設備等を設置したときの届出及び検査について、消防法令上、正しいものは次のうちどれか。","ch":["消防用設備等を設置したとき、届け出なければならないのは、その消防用設備等を設置した消防設備士である。","特定防火対象物に消防用設備等を設置した場合は、消防用設備等の種類にかかわらず、すべて届け出て検査を受けなければならない。","防火対象物の用途にかかわらず、消防法第 17 条に基づいて設置した消防用設備等については、すべて届け出て検査を受けなければならない。","工場、倉庫等の特定防火対象物でない防火対象物に設置した消防用設備等であっても、消防長又は消防署長に届け出て検査を受けなければならない場合がある。"],"ans":[4],"exp":"1. 届け出なければならないのは、その防火対象物の関係者である。\n2. 消防用設備等のうち、簡易消火用具と非常警報器具は、届出と検査が必要ない。\n3. 防火対象物の区分や用途、延べ面積によって、届出と検査の必要の有無は異なる。\n4. 防火対象物のうち、延べ面積が300㎡以上のもののうち、消防長又は消防署長が火災予防上必要があると認めて指定するものは、消防長又は消防署長に届け出て検査を受けなければならない。"},
{"id":"s1-10-5","sec":"10. 消防用設備等の届出及び検査","star":0,"q":"設置義務のある消防用設備等（簡易消火用具及び非常警報器具を除く。）を設置したときの届出及び検査に関する記述について、消防法令上、正しいものは次のうちどれか。","ch":["特定防火対象物に消防用設備等を設置したとき、消防設備士は消防長又は消防署長に届け出て検査を受けなければならない。","延べ面積が 300m² 以上の防火対象物に消防用設備等を設置したとき、消防設備士は消防長又は消防署長に届け出て検査を受けなければならない。","特定防火対象物以外の防火対象物であっても延べ面積が 300m² 以上あり、かつ、消防長又は消防署長から火災予防上必要があると認めて指定された場合は、届け出て検査を受けなければならない。","特定防火対象物に消防用設備等を設置したとき、防火対象物の関係者は市町村長等に届け出て検査を受けなければならない。"],"ans":[3],"exp":"1＆2. 「消防設備士」⇒「関係者」。\n4. 「市町村長等」⇒「消防長又は消防署長」。"},
{"id":"s1-10-6","sec":"10. 消防用設備等の届出及び検査","star":0,"q":"消防用設備等の設置届に基づく検査について、消防法令上、誤っているものは次のうちどれか。","ch":["特定防火対象物で延べ面積が 300m² 以上ある場合は、検査を受けなければならない。","特定防火対象物以外の防火対象物で延べ面積が 300m² 以上のもののうち、消防長又は消防署長が火災予防上必要があると認めて指定する場合は、検査を受けなければならない。","消防用設備等のうち簡易消火用具及び非常警報器具は、検査の対象から除かれている。","検査を受けようとする特定防火対象物の関係者は、消防用設備等の設置に係る工事が完了した日から 10 日以内に消防長又は消防署長に届け出なければならない。"],"ans":[4],"exp":"4. 「工事が完了した日から10日以内」⇒「工事が完了した日から4日以内」。"},
{"id":"s1-10-7","sec":"10. 消防用設備等の届出及び検査","star":1,"q":"消防用設備等を設置したときの届出及び検査について、消防法令上、誤っているものは次のうちどれか。","ch":["特定防火対象物であっても簡易消火用具を設置した場合は、届け出て検査を受ける必要はない。","特定防火対象物以外のものであっても自動火災報知設備を設置した場合は、届け出て検査を受けなければならないものがある。","特定防火対象物で延べ面積が 300m² 未満であっても、届け出て検査を受けなければならないものがある。","特定防火対象物以外のものについては、すべて届け出て検査を受ける必要はない。"],"ans":[4],"exp":"2. 設問では「自動火災報知設備」と特定しているが、「消防用設備等」であればいずれでもよい。特定防火対象物以外のものであっても消防用設備等を設置した場合は、届け出て検査を受けなければならないもの（延べ面積が300㎡以上で、消防長又は消防署長が指定するもの）がある。\n4. 特定防火対象物以外のものについては、すべて届け出て検査を受ける必要はない。"},
{"id":"s1-10-8","sec":"10. 消防用設備等の届出及び検査","star":0,"q":"消防用設備等の設置義務のある延べ面積が300m²以上の防火対象物に、消防用設備等（簡易消火用具及び非常警報器具を除く。）を設置したときの届出及び検査について、消防法令上、正しいものは次のうちどれか。","ch":["特定防火対象物に設備等技術基準に従って設置したときは、市町村長に届け出て、検査を受けなければならない。","特定防火対象物に設備等技術基準に従って設置したときは、消防長又は消防署長に届け出て、検査を受けなければならない。","特定防火対象物以外であっても、設備等技術基準に従って設置したときは、すべて市町村長に届け出て、検査を受けなければならない。","特定防火対象物以外であっても、設備等技術基準に従って設置したときは、すべて消防長又は消防署長に届け出て、検査を受けなければならない。"],"ans":[2],"exp":"届出先は「消防長又は消防署長」。非特定防火対象物は「すべて」ではなく、指定を受けた場合のみ義務となる。"},
{"id":"s1-10-9","sec":"10. 消防用設備等の届出及び検査","star":0,"q":"消防用設備等を設備等技術基準に従って設置した場合、消防長又は消防署長に届け出て検査を受けなくてもよい防火対象物として、消防法令上、正しいものは次のうちどれか。ただし、当該防火対象物の避難階は1階であり、階段は屋内にのみ設けられ、総務省令で定める避難上有効な構造を有していないものとする。","ch":["地上に直通する階段が1か所ある2階建ての旅館で、延べ面積が100m²のもの","地上に直通する階段が1か所ある3階建ての飲食店で、延べ面積が150m²のもの","地上に直通する階段が2か所ある4階建ての入院施設のある診療所で、延べ面積が200m²のもの","地上に直通する階段が2か所ある5階建ての作業場で、延べ面積が250m²のもの"],"ans":[4],"exp":"1. この旅館は、特定一階段等防火対象物に該当しない。しかし、旅館は延べ面積に関係なく、消防用設備等の届出及び検査が必要となる。\n2. この飲食店は、特定一階段等防火対象物に該当するため、消防用設備等の届出及び検査が必要となる。\n3. この診療所は、特定一階段等防火対象物に該当しない。しかし、入院施設がある診療所は延べ面積に関係なく、消防用設備等の届出及び検査が必要となる。\n4. この作業場は、特定一階段等防火対象物に該当しない。さらに、工場は延べ面積が300㎡以上で消防長又は消防署長から指定を受けると、消防用設備等の届出及び検査が必要となる。延べ面積250㎡の作業場は届出及び検査が不要となる。"},
{"id":"s1-11-1","sec":"11. 工事整備対象設備等の着工届","star":0,"q":"工事整備対象設備等の着工届に関する次の記述のうち、消防法令上、正しいものの組合せはどれか。\nア. 甲種消防設備士のみ届け出の義務がある。\nイ. 工事に着手した日から10日以内に届け出なければならない。\nウ. 工事整備対象設備等着工届出書には、工事の設計に関する図書の写しを添付しなければならない。","ch":["ア、イのみ","ア、ウのみ","イ、ウのみ","ア、イ、ウすべて"],"ans":[2],"exp":"イ. 工事に着手しようとする日の10日前までに届け出なければならない。"},
{"id":"s1-11-2","sec":"11. 工事整備対象設備等の着工届","star":0,"q":"工事整備対象設備等の着工届について、消防法令上、正しいものは次のうちどれか。","ch":["防火対象物の関係者が、工事に着手しようとする日の10日前までに都道府県知事に届け出る。","甲種消防設備士が、工事に着手しようとする日の10日前までに消防長又は消防署長に届け出る。","甲種消防設備士が、工事に着手しようとする日の7日前までに消防長又は消防署長に届け出る。","防火対象物の関係者が、工事に着手しようとする日の7日前までに消防長又は消防署長に届け出る。"],"ans":[2],"exp":""},
{"id":"s1-11-3","sec":"11. 工事整備対象設備等の着工届","star":0,"q":"工事整備対象設備等の工事の届出について、消防法令上、正しいものは次のうちどれか。","ch":["甲種消防設備士は、消防用設備等の工事に着手しようとする場合、消防長又は消防署長に必要な事項について届け出なければならない。","防火対象物の関係者は、消防用設備等の工事に着手しようとする場合、消防長又は消防署長に必要な事項について届け出なければならない。","甲種消防設備士は、消防用設備等の工事に着手したときは、遅滞なく消防長又は消防署長に必要な事項について届け出なければならない。","防火対象物の関係者は、消防用設備等の工事に着手したときは、遅滞なく消防長又は消防署長に必要な事項について届け出なければならない。"],"ans":[1],"exp":"2〜4. 甲種消防設備士は、消防用設備等の工事に着手しようとする場合、その工事に着手しようとする日の10日前までに、消防長又は消防署長に必要な事項について届け出なければならない。"},
{"id":"s1-11-4","sec":"11. 工事整備対象設備等の着工届","star":0,"q":"工事整備対象設備等の着工届について、消防法令上、正しいものは次のうちどれか。","ch":["甲種消防設備士は、工事に着手しようとする場合、工事整備対象設備等着工届出書を10日前までに都道府県知事に提出しなければならない。","特定防火対象物の関係者は、工事に着手しようとする場合、工事整備対象設備等着工届出書を10日前までに都道府県知事に提出しなければならない。","甲種消防設備士は、工事に着手しようとする場合、工事整備対象設備等着工届出書を10日前までに消防長又は消防署長に提出しなければならない。","特定防火対象物の関係者は、工事に着手しようとする場合、工事整備対象設備等着工届出書を10日前までに消防長又は消防署長に提出しなければならない。"],"ans":[3],"exp":"1. 着工届出書は、消防長又は消防署長に提出しなければならない。\n2＆4. 着工届出書は、甲種消防設備士が消防長又は消防署長に提出する"},
{"id":"s1-12-1","sec":"12. 消防用設備等の設置命令と維持命令","star":0,"q":"消防用設備等の設置維持命令に関する記述について、文中の（　）に当てはまる語句の組合せとして、消防法令上、正しいものは次のうちどれか。\n「（ア）は、防火対象物における消防用設備等が（イ）に従って設置され、又は維持されていないと認めるときは、当該防火対象物の関係者で（ウ）に対し、（イ）に従ってこれを設置すべきこと、又はその維持のため、必要な措置をなすべきことを命ずることができる。」","ch":["消防長又は消防署長／設備等技術基準／権原を有する者","都道府県知事／設備等設置維持計画／防火管理者","消防長又は消防署長／設備等設置維持計画／権原を有する者","都道府県知事／設備等技術基準／防火管理者"],"ans":[1],"exp":""},
{"id":"s1-12-2","sec":"12. 消防用設備等の設置命令と維持命令","star":0,"q":"消防用設備等が技術上の基準に適合していない場合、必要な措置を行うよう命令を受ける者として、消防法令上、正しいものは次のうちどれか。","ch":["防火対象物の関係者で権原を有する者","防火対象物の占有者","防火対象物の消防用設備等を工事した消防設備士","防火対象物の消防用設備等を点検した消防設備士"],"ans":[1],"exp":"命令を受けるのは、防火対象物の関係者で権原を有する者である。防火対象物の関係者とは、防火対象物の所有者、管理者又は占有者をいう。"},
{"id":"s1-12-3","sec":"12. 消防用設備等の設置命令と維持命令","star":0,"q":"消防用設備等の設置及び維持に関する命令についての記述として、消防法令上、誤っているものは次のうちどれか。","ch":["命令は任意に設置した消防用設備等までは及ばない。","消防用設備等の設置義務がある防火対象物に消防用設備等の一部が設置されていない場合であっても命令の対象となる。","命令を発することができる者は、消防長又は消防署長である。","命令の相手方は、防火対象物の関係者であれば当該消防用設備等について権原を有しなくてもよい。"],"ans":[4],"exp":"1. 法令では、「第17条1項の防火対象物における消防用設備等…」としているため、消防法に従って設置された消防用設備等が設置命令と維持命令の対象となる。\n4. 防火対象物の関係者で、消防用設備等について権原を有する者でなければならない。"},
{"id":"s1-12-4","sec":"12. 消防用設備等の設置命令と維持命令","star":1,"q":"消防用設備等の設置又は維持に関する命令について、消防法令上、正しいものを3つ選びなさい。","ch":["消防長又は消防署長は、消防用設備等が技術基準に従って維持されていない場合、防火対象物の関係者で権原を有する者に対して、必要な措置をとることを命ずることができる。","消防長又は消防署長は、消防用設備等が技術基準に従って設置されていない場合、工事に従事した消防設備士に対して、工事の手直しを命ずることができる。","設置の命令に違反して消防用設備等を設置しなかった者は、罰金又は拘留に処せられる。","設置の命令に違反して消防用設備等を設置しなかった者は、拘禁刑又は罰金に処せられる。","維持の命令に違反して消防用設備等の維持のため必要な措置をとらなかった者は、拘禁刑又は罰金に処せられる。","維持の命令に違反して消防用設備等の維持のため必要な措置をとらなかった者は、罰金又は拘留に処せられる。"],"ans":[1,4,6],"exp":"2. 設置命令及び維持命令ともに、命令を受けるのは、防火対象物の関係者で権原を有する者である。\n3. 設置命令違反は「罰金又は拘留」⇒「拘禁刑又は罰金」。\n5. 維持命令違反は「拘禁刑又は罰金」⇒「罰金又は拘留」。\n※法改正により、設置命令違反の「懲役又は罰金」が「拘禁刑又は罰金」に改正された（編集部）。","multi":1},
{"id":"s1-13-1","sec":"13. 消防設備士でなければ行ってはならない工事又は整備","star":0,"q":"消防設備士免状の交付を受けていない者でも、工事又は整備を行うことができる消防用設備等の部分について、消防法令上、正しいものは次のうちどれか。","ch":["泡消火設備の配管部分","ハロゲン化物消火設備の配管部分","粉末消火設備の配管部分","スプリンクラー設備の配管部分"],"ans":[4],"exp":"1〜3. 泡消火設備・ハロゲン化物消火設備・粉末消火設備の配管部分は、消防設備士でなければ行ってはならない工事又は整備に含まれている。\n4. スプリンクラー設備の配管部分は、消防設備士でなければ行ってはならない工事又は整備の対象から除外されている。配管は、スプリンクラー設備の他、屋内消火栓設備・水噴霧消火設備・屋外消火栓設備についても対象から除外されている。"},
{"id":"s1-13-2","sec":"13. 消防設備士でなければ行ってはならない工事又は整備","star":0,"q":"消防設備士でなければ工事又は整備を行うことができない消防用設備等の部分について、消防法令上、正しいものは次のうちどれか。","ch":["スプリンクラー設備の配管部分","粉末消火設備の貯蔵容器部分","屋内消火栓設備の水源部分","泡消火設備の電源部分"],"ans":[2],"exp":"1＆3. スプリンクラー設備、屋内消火栓設備の「電源・水源・配管」部分は、消防設備士でなければ行ってはならない工事又は整備の対象から除外されている。\n4. 泡消火設備の「電源」部分は、消防設備士でなければ行ってはならない工事又は整備の対象から除外されている。"},
{"id":"s1-13-3","sec":"13. 消防設備士でなければ行ってはならない工事又は整備","star":0,"q":"消防設備士でなければ行うことができない消防用設備等の工事又は整備の範囲として、消防法令上、誤っているものは次のうちどれか。","ch":["泡消火設備の配管の接続工事","自動火災報知設備の感知器の設置工事","消火器の消火薬剤の詰替え","屋内消火栓設備のネジ類等部品の交換"],"ans":[4],"exp":"4. 屋内消火栓設備のネジ類等部品の交換は、消防設備士でなくても行える整備の範囲に該当する。"},
{"id":"s1-13-4","sec":"13. 消防設備士でなければ行ってはならない工事又は整備","star":0,"q":"工事整備対象設備等着工届出書による届出が必要となる消防用設備等として、消防法令上、正しいものは次のうちどれか。","ch":["誘導灯","消防機関へ通報する火災報知設備","非常警報設備","漏電火災警報器"],"ans":[2],"exp":"法第17条の14（「11 工事整備対象設備等の着工届」58P参照）では、法第17条の5の規定に基づく工事をしようとするときは、工事整備対象設備等の着工届出書を届け出るよう規定している。従って、「法第17条の5の規定に基づく工事」であるかどうかが、この問題のポイントとなる。\n消防設備士でなければ行ってはならない工事又は整備の一覧によると、「消防機関へ通報する火災報知設備」は含まれている。しかし、誘導灯と非常警報設備は一覧に含まれていない。また、漏電火災警報器は一覧に含まれているが、設置工事ではなく整備のみが対象としてあり、着工届出書による届出は要らない。"},
{"id":"s1-13-5","sec":"13. 消防設備士でなければ行ってはならない工事又は整備","star":1,"q":"消防設備士でなければ工事又は整備を行うことができない消防用設備等の組合せとして、消防法令上、正しいものを2つ選びなさい。","ch":["屋内消火栓設備、不活性ガス消火設備、スプリンクラー設備、動力消防ポンプ設備","泡消火設備、粉末消火設備、パッケージ型消火設備","泡消火設備、不活性ガス消火設備、粉末消火設備","自動火災報知設備、漏電火災警報器、粉末消火設備","消火器、救助袋、すべり台","消火器、すべり台、緩降機"],"ans":[2,3],"exp":"1. 動力消防ポンプ設備は、消防設備士でなければ工事又は整備を行ってはならない消防用設備等の対象外である。\n2. パッケージ型消火設備は、告示により対象とする消防用設備等に含まれている。\n4. 漏電火災警報器は工事は含まれず「整備のみ」が対象である（または放送設備等は対象外）。\n5＆6. すべり台は対象外である。","multi":1},
{"id":"s1-13-6","sec":"13. 消防設備士でなければ行ってはならない工事又は整備","star":0,"q":"消防設備士でなくても行うことができる消防用設備等の工事又は整備の範囲として、消防法令上、誤っているものは次のうちどれか。","ch":["給水装置工事主任技術者であるAは、スプリンクラー設備の水源に水を補給するための給水管を交換した。","電気主任技術者であるBは、自動火災報知設備の電源表示ランプを交換した。","電気工事士であるCは、屋内消火栓の表示灯が消えていたので、表示灯配線の断線の有無について検査して、電球を取り替えた。","水道事業者であるDは、屋外消火栓の水漏れ補修を頼まれ、水漏れの原因となった屋外消火栓開閉弁を新品と交換した。"],"ans":[4],"exp":"1. 法第17条の5の規定に基づく工事に、「配管」は除く、としている。\n2＆3. 消防設備士でなくとも行える軽微な整備として、「表示灯の交換」「その他これらに類するもの」がある。電源表示ランプの交換や表示灯の電球の取り替えは、軽微な整備に該当するものと判断する。"},
{"id":"s1-13-7","sec":"13. 消防設備士でなければ行ってはならない工事又は整備","star":0,"q":"消防設備士でなくても行える消防用設備等の工事又は整備の範囲として、消防法令上、誤っているものは次のうちどれか。","ch":["水道事業者であるAは、屋内消火栓の水漏れの補修を頼まれ、屋内消火栓開閉弁を新品のものに取り替えた。","電気工事士であるBは、定期点検中、屋内消火栓の表示灯が消えているのを見つけ、表示灯配線を検査して異常がないことを確認してから、電球を取り替えた。","防火管理者であるCは、定期点検中、屋外消火栓箱の扉のがたついているのを見つけ、取り外して修理した後取り付けた。","自衛消防隊長であるDは、消火訓練中、屋外消火栓ホースが傷んでいるのに気づき、訓練終了後ホースを取り替えたが、そのときノズルも交換した。"],"ans":[1],"exp":"2〜4. 屋内消火栓設備の表示灯の交換、消火栓箱の補修及び消火栓ホース・ノズルの交換は、消防設備士でなくても行える整備の範囲に含まれている。"},
{"id":"s1-13-8","sec":"13. 消防設備士でなければ行ってはならない工事又は整備","star":0,"q":"消防設備士でなければ工事又は整備を行うことができない消防用設備等として、消防法令上、誤っているものは次のうちどれか。","ch":["スプリンクラー設備","泡消火設備","非常警報設備","漏電火災警報器"],"ans":[3],"exp":"3. 非常警報設備は、非常ベル、自動式サイレン、放送設備が該当する。自動火災報知設備とともに警報設備に含まれる。しかし、消防設備士でなければ工事又は整備を行うことができない消防用設備等には該当しない。"},
{"id":"s1-14-1","sec":"14. 消防用設備等の技術上の基準と異なる規定","star":0,"q":"法令上、その地方の気候又は風土の特殊性により、法に定める消防用設備等の技術上の基準に関する政令又はこれに基づく命令の規定のみによっては防火の目的を充分に達し難いと認めるときは、同項の消防用設備等の技術上の基準に関して、当該政令又はこれに基づく命令の規定と異なる規定を設けることができる。この基準を定めるのは次のうちどれか。","ch":["消防庁長官の定める基準","市町村条例","都道府県知事の定める基準","市町村規則"],"ans":[2],"exp":""},
{"id":"s1-14-2","sec":"14. 消防用設備等の技術上の基準と異なる規定","star":0,"q":"消防法第17条第2項に規定されている付加条例について、最も適切なものは次のうちどれか。","ch":["市町村の付加条例によって、消防用設備等の設置及び維持に関する技術上の基準について、政令で定める基準を強化することができる。","市町村の付加条例によって、消防用設備等の設置及び維持に関する技術上の基準について、政令で定める基準を緩和することができる。","市町村の付加条例によって、消防法施行令別表第1の防火対象物以外の防火対象物に対して消防用設備等の設置を義務付けることができる。","市町村の付加条例によって、政令で定める消防用設備等の一部を設置しなくてもよいという特例基準を定めることができる。"],"ans":[1],"exp":"1. 消防用設備等の技術上の基準について、市町村は政令又はこれに基づく命令の規定と異なる規定を条例として追加することができる。この結果、消防用設備等の技術上の基準はより厳しい内容となる。条例では法令で定める消防用設備等の技術上の基準そのものを緩和することはできない。"},
{"id":"s1-15-1","sec":"15. 基準の特例","star":1,"q":"消防用設備等の設置に際し、政令に定める基準によらなくてもよいものに関する記述について、文中の（　）に当てはまる語句として、消防法令上、正しいものは次のうちどれか。\n「第2章第3節に定める消防用設備等の設置及び維持の技術上の基準の規定は、消防用設備等について、（　）が、防火対象物の位置、構造又は設備の状況から判断して、この規定による消防用設備等の基準によらなくとも、火災の発生又は延焼のおそれが著しく少なく、かつ、火災等の災害による被害を最少限度に止めることができると認めるときにおいては、適用しない。」","ch":["総務大臣","都道府県知事","市町村長","消防長又は消防署長"],"ans":[4],"exp":""},
{"id":"s1-16-1","sec":"16. 消防設備士の免状","star":1,"q":"消防設備士が行うことができる工事又は整備について、消防法令上、誤っているものは次のうちどれか。","ch":["甲種特類消防設備士免状の交付を受けている者は、消防用設備等のすべて及び特殊消防用設備等について、整備を行うことができる。","甲種第4類消防設備士免状の交付を受けている者は、危険物製造所等に設置する自動的に作動する火災報知設備の工事を行うことができる。","乙種第1類消防設備士免状の交付を受けている者は、屋外消火栓設備の開閉弁の整備を行うことができる。","乙種第5類消防設備士免状の交付を受けている者は、緩降機本体及びその取付け具の整備を行うことができる。"],"ans":[1],"exp":"1. 甲種特類消防設備士免状の交付を受けている者は、特殊消防用設備等について、工事又は整備を行うことができる。"},
{"id":"s1-16-2","sec":"16. 消防設備士の免状","star":0,"q":"消防設備士が行うことができる工事又は整備について、消防法令上、誤っているものは次のうちどれか。","ch":["甲種第1類の消防設備士は、スプリンクラー設備の整備を行うことができる。","甲種第2類の消防設備士は、泡消火設備の工事を行うことができる。","甲種第4類の消防設備士は、漏電火災警報器の整備を行うことができる。","乙種第3類の消防設備士は、粉末消火設備の整備を行うことができる。"],"ans":[3],"exp":"3. 漏電火災警報器の整備を行うためには、乙種第7類の消防設備士資格が必要となる。"},
{"id":"s1-16-3","sec":"16. 消防設備士の免状","star":0,"q":"消防設備士が行う工事又は整備について、消防法令上、誤っているものは次のうちどれか。","ch":["甲種第5類の消防設備士免状の交付を受けている者は、緩降機及び救助袋の工事を行うことができる。","乙種第4類の消防設備士免状の交付を受けている者は、ガス漏れ火災警報設備の整備を行うことができる。","乙種第2類の消防設備士免状の交付を受けている者は、泡消火設備の整備を行うことができる。","乙種第1類の消防設備士免状の交付を受けている者は、水噴霧消火設備の工事を行うことができる。"],"ans":[4],"exp":"4. 「水噴霧消火設備の工事」⇒「水噴霧消火設備の整備」。"},
{"id":"s1-16-4","sec":"16. 消防設備士の免状","star":0,"q":"消防設備士が行う工事又は整備について、消防法令上、正しいものは次のうちどれか。","ch":["甲種第1類の消防設備士は、泡消火設備の整備を行うことができる。","乙種第5類の消防設備士は、金属製避難はしごの設置工事を行うことができる。","甲種第4類の消防設備士は、自動火災報知設備の設置工事を行うことができる。","乙種第6類の消防設備士は、漏電火災警報器の整備を行うことができる。"],"ans":[3],"exp":"1. 甲種第1類の消防設備士は、屋内消火栓設備、スプリンクラー設備、水噴霧消火設備又は屋外消火栓設備などの工事又は整備を行うことができる。泡消火設備の整備を行うためには、甲種第2類又は乙種第2類の消防設備士資格が必要となる。\n2. 乙種第5類の消防設備士は、金属製避難はしごの整備を行うことができる。設置工事を行うためには、甲種第5類の消防設備士資格が必要となる。\n4. 漏電火災警報器の整備を行うためには、乙種第7類の消防設備士資格が必要となる。"},
{"id":"s1-16-5","sec":"16. 消防設備士の免状","star":0,"q":"消防設備士に関する記述として、消防法令上、誤っているものは次のうちどれか。","ch":["消防用設備等の移設には、乙種消防設備士の資格を必要とする場合がある。","消防用設備等の増設には、甲種消防設備士の資格を必要とする場合がある。","消防用設備等の不良箇所が指定された場合の不良機器の調整、又は部品交換には、乙種消防設備士の資格を必要とする場合がある。","消防用設備等の新設には、甲種消防設備士の資格を必要とする場合がある。"],"ans":[1],"exp":"1. 消防用設備等の移設は「工事」に該当するため、甲種消防設備士の資格が必要である。"},
{"id":"s1-16-6","sec":"16. 消防設備士の免状","star":1,"q":"A、B、C、Dの4人は、それぞれ消防用設備等の工事又は整備を行ったが、消防法令上、違反とならないものは次のうちどれか。","ch":["共同住宅の所有者であるAは、この建物が自動火災報知設備の設置の義務があるため、消防設備士の免状の交付を受けていないが、電気工事士の資格を持っているため、自分でその建物に自動火災報知設備の設置工事を行った。","危険物の関係施設の工事を業としているBは、得意先から危険物の製造所に義務設置の第3種の消火設備の設置工事を依頼された。危険物の製造所が消防法第17条第1項の適用を受ける対象物ではないと考え、設置工事を行った。","甲種第2類の消防設備士の免状の交付を受けているCは、消火器の販売に従事し、消火薬剤詰め替え等の整備を行った。","乙種第3類の消防設備士の免状の交付を受けているDは、自分が経営している工場に設置されている粉末消火設備の整備を行った。"],"ans":[4],"exp":"1. 自動火災報知設備の設置工事は、甲種第4類の消防設備士の免状の交付を受けている者が行う。\n2. 危険物の製造所に行う第3種の消火設備（下表参照）の設置工事は、甲種第1類、甲種第2類又は甲種第3類の消防設備士の免状の交付を受けている者が行う。\n3. 消火器の消火薬剤詰め替え等の整備は、乙種第6類の消防設備士の免状の交付を受けている者が行う。\n4. 粉末消火設備の整備は、甲種第3類または乙種第3類の消防設備士の免状の交付を受けている者が行う。"},
{"id":"s1-17-1","sec":"17. 消防設備士免状の取り扱い","star":1,"q":"消防設備士免状に関する次の記述について、消防法令上、正しいものを2つ選びなさい。","ch":["消防設備士免状の交付を受けた都道府県以外で業務に従事するときは、業務地を管轄する都道府県知事に免状の書換えを申請しなければならない。","消防設備士免状の記載事項に変更を生じた場合、当該免状を交付した都道府県知事又は居住地若しくは勤務地を管轄する都道府県知事に免状の書換えを申請しなければならない。","消防設備士免状を亡失したときは、亡失した日から10日以内に免状の再交付を申請しなければ、当該免状は自動的に失効する。","消防設備士免状の返納を命ぜられた日から3年を経過しない者については、新たに試験に合格しても免状が交付されないことがある。","消防設備士免状の返納を命ぜられた日から1年を経過しない者については、新たに試験に合格しても免状が交付されないことがある。"],"ans":[2,5],"exp":"1. 消防設備士の免状は都道府県知事が交付する。ただし、「業務地」に関する規定はないため、免状は全国で有効である。\n2. 消防設備士免状の記載事項に変更を生じた場合は、遅滞なく\n   ①免状を交付した都道府県知事\n   ②居住地を管轄する都道府県知事\n   ③勤務地を管轄する都道府県知事\n   のいずれかにその書換えを申請しなければならない。\n3. 消防設備士免状を亡失した場合、再交付を申請することができる。ただし、申請期限は設けられていない。なお、再交付を受けた後に亡失した免状を発見した場合は、これを10日以内に免状の再交付をした都道府県知事に提出しなければならない。\n   4＆5. 都道府県知事は、①免状の返納を命ぜられて1年を経過しない者、②消防法で罰金以上の刑に処せられ2年を経過しない者、については免状を交付しないことができる。","multi":1},
{"id":"s1-17-2","sec":"17. 消防設備士免状の取り扱い","star":0,"q":"消防設備士免状に関して、消防法令上、誤っているものは次のうちどれか。","ch":["消防設備士免状の記載事項に変更を生じたときは、免状を交付した都道府県知事又は居住地若しくは勤務地を管轄する都道府県知事に免状の書換えを申請しなければならない。","消防設備士免状を亡失したときは、亡失に気付いた日から10日以内に免状を交付した都道府県知事に免状の再交付を申請しなければならない。","消防設備士免状を汚損又は破損した者は、免状を交付した都道府県知事に免状の再交付を申請することができる。","消防設備士免状の返納命令に違反した者は、罰金又は拘留に処せられることがある。"],"ans":[2],"exp":"2. 免状を亡失したことによる再交付の申請に期限は設けられていない。"},
{"id":"s1-17-3","sec":"17. 消防設備士免状の取り扱い","star":1,"q":"消防設備士免状の書換えについて、消防法令上、正しいものは次のうちどれか。","ch":["免状に貼ってある写真が撮影した日から10年を超えた場合は、居住地又は勤務地を管轄する消防長又は消防署長に書換えの申請をしなければならない。","居住地に変更が生じた場合は、居住地又は勤務地を管轄する都道府県知事に書換えの申請をしなければならない。","氏名に変更が生じた場合は、免状を交付した都道府県知事又は居住地若しくは勤務地を管轄する都道府県知事に書換えの申請をしなければならない。","本籍地の属する都道府県に変更が生じた場合は、新たな本籍地を管轄する消防長又は消防署長に書換えの申請をしなければならない。"],"ans":[3],"exp":"1. 免状に貼ってある写真が撮影した日から10年を超えた場合は、免状の記載事項の変更に該当するため、遅滞なく当該免状を交付した都道府県知事又は居住地若しくは勤務地を管轄する都道府県知事にその書換えを申請しなければならない。\n2. 居住地の変更は、免状の記載事項の変更に該当しない。従って、免状の書換え申請は必要ない。\n3. 氏名の変更は、免状の記載事項の変更に該当する。\n4. 本籍地の属する都道府県の変更は、免状の記載事項の変更に該当するため、遅滞なく当該免状を交付した都道府県知事又は居住地若しくは勤務地を管轄する都道府県知事に書換えの申請をしなければならない。"},
{"id":"s1-17-4","sec":"17. 消防設備士免状の取り扱い","star":0,"q":"消防設備士免状を亡失した場合の再交付申請先として、消防法令上、正しいものは次のうちどれか。","ch":["居住地又は勤務地を管轄する都道府県知事","居住地又は勤務地を管轄する消防長又は消防署長","当該免状の交付又は書換えをした都道府県知事","当該免状の交付又は書換えをした消防長又は消防署長"],"ans":[3],"exp":"免状を亡失した場合は、当該免状の交付又は書換えをした都道府県知事にその再交付を申請する。"},
{"id":"s1-17-5","sec":"17. 消防設備士免状の取り扱い","star":0,"q":"消防設備士免状を亡失してその再交付を受けた者が、亡失した免状を発見した場合は、これを一定期間以内に免状の再交付をした都道府県知事に提出しなければならないとされているが、その期間として、消防法令上、正しいものは次のうちどれか。","ch":["7日以内","10日以内","14日以内","20日以内"],"ans":[2],"exp":""},
{"id":"s1-17-6","sec":"17. 消防設備士免状の取り扱い","star":0,"q":"交付を受けている消防設備士免状の記載事項の変更に係る書換えの申請先として、消防法令上、誤っているものは次のうちどれか。","ch":["居住地を管轄する都道府県知事","勤務地を管轄する都道府県知事","本籍地を管轄する都道府県知事","免状の交付を受けた都道府県知事"],"ans":[3],"exp":"3. 免状の書換えは、当該免状を交付した都道府県知事、居住地または勤務地を管轄する都道府県知事に申請する。"},
{"id":"s1-17-7","sec":"17. 消防設備士免状の取り扱い","star":0,"q":"消防設備士免状に関する申請とその申請先について、消防法令上、誤っているものの組み合わせは次のうちどれか。","ch":["書換え / 居住地又は勤務地を管轄する都道府県知事","再交付 / 免状を交付した都道府県知事","書換え / 免状を交付した都道府県知事","再交付 / 居住地又は勤務地を管轄する都道府県知事"],"ans":[4],"exp":"4. 免状の再交付は、当該免状の交付又は書換えをした都道府県知事に申請する。"},
{"id":"s1-17-8","sec":"17. 消防設備士免状の取り扱い","star":0,"q":"消防設備士免状の書換えまたは再交付に関する記述として、消防法令上、正しいものは次のうちどれか。","ch":["消防設備士免状の交付を受けている者は、当該免状の交付を受けた都道府県以外の地域で業務に従事するときでも、免状の記載事項に変更がなければ、免状の書換えを申請する必要はない。","消防設備士免状の交付を受けている者は、当該免状の写真が撮影から10年を経過した場合でも、免状の記載事項に変更がなければ、免状の書換えを申請する必要はない。","消防設備士免状の交付を受けている者で、当該免状を破損した場合には、破損した日から10日以内に当該免状を交付または書換えをした都道府県知事に、その再交付を申請しなければならない。","消防設備士免状を亡失してその再交付を受けた者は、亡失した免状を発見した場合には、これを14日以内に再交付を受けた都道府県知事に提出しなければならない。"],"ans":[1],"exp":"1. 「業務地」に関する規定はない。免状は全国で有効である。\n2. 破損等の理由により免状の再交付を受ける場合も含め、再交付の申請には期限が設けられていない。"},
{"id":"s1-17-9","sec":"17. 消防設備士免状の取り扱い","star":0,"q":"消防設備士免状の記載事項について、消防法令に定められていないものは、次のうちどれか。","ch":["免状の交付年月日及び交付番号","氏名及び生年月日","現住所","過去10年以内に撮影した写真"],"ans":[3],"exp":"3. 消防設備士免状の記載事項に、現住所は含まれていない。"},
{"id":"s1-17-10","sec":"17. 消防設備士免状の取り扱い","star":0,"q":"次の文中の（　）に当てはまる数値及び語句の組合せとして、消防法令に定められているものは次のうちどれか。\n「消防設備士免状を亡失してその再交付を受けた者は、亡失した免状を発見した場合には、これを（ア）日以内に免状の再交付をした（イ）に提出しなければならない。」","ch":["ア：10 / イ：都道府県知事","ア：10 / イ：消防長又は消防署長","ア：14 / イ：都道府県知事","ア：14 / イ：消防長又は消防署長"],"ans":[1],"exp":""},
{"id":"s1-17-11","sec":"17. 消防設備士免状の取り扱い","star":0,"q":"消防設備士免状の返納について、消防法令上、誤っているものは次のうちどれか。","ch":["返納を命ずるのは、消防長又は消防署長である。","返納を命ずることができるのは、消防設備士が消防法令上の規定に違反している場合である。","免状の返納命令に従わない場合には、罰則の適用がある。","免状の返納命令により、消防設備士の資格を喪失する。"],"ans":[1],"exp":"1. 返納を命ずるのは、免状を交付した都道府県知事である。"},
{"id":"s1-17-12","sec":"17. 消防設備士免状の取り扱い","star":0,"q":"消防設備士が消防法令上の規定に違反しているとき、当該消防設備士の免状の返納を命ずることができる者として、正しいものは次のうちどれか。","ch":["消防設備士の免状を交付した都道府県知事","消防設備士が違反した場所を管轄する都道府県知事","消防設備士の居住地又は勤務地を管轄する都道府県知事","消防設備士の本籍地の属する都道府県知事"],"ans":[1],"exp":""},
{"id":"s1-18-1","sec":"18. 消防設備士の講習","star":1,"q":"工事整備対象設備等の工事又は整備に関する講習の実施者として、消防法令上、正しいものは次のうちどれか。","ch":["都道府県知事","総務大臣","消防長又は消防署長","消防庁長官"],"ans":[1],"exp":"講習の実施者は「都道府県知事（総務大臣が指定する市町村長その他の機関を含む。）」である（消防法第17条の10）。"},
{"id":"s1-18-2","sec":"18. 消防設備士の講習","star":0,"q":"都道府県知事（総務大臣が指定する市町村長その他の機関を含む。）が行う工事整備対象設備等の工事又は整備に関する講習について、消防法令上、誤っているものは次のうちどれか。","ch":["消防設備士免状の交付を受けた日から5年以内ごとに受講しなければならない。","工事整備対象設備等の工事又は整備に従事していない消防設備士も受講しなければならない。","消防設備士免状の種類及び指定区分等に応じて行われる。","定められた期間内に受講しなければ、消防設備士免状の返納を命ぜられることがある。"],"ans":[1],"exp":"1. 誤り。1回目の講習は、免状交付日以降における最初の4月1日から2年以内に受講しなければならない。\n2. 正しい。この講習は、消防設備士免状の交付を受けているすべての者が対象となる。\n3. 正しい。講習の実施細目について、消防庁から各都道府県等に通達が出されている。通達によると、消防設備士免状の種類及び指定区分に従い、講習を「特殊消防用設備等」、「消火設備」、「警報設備」及び「避難設備・消火器」の4種類に区分し実施することが定められている。\n4. 正しい。この講習の未受講は、「この法律又はこの法律に基づく命令の規定に違反」していることに該当するため、免状の返納を命じられることがある。"},
{"id":"s1-18-3","sec":"18. 消防設備士の講習","star":0,"q":"都道府県知事（総務大臣が指定する市町村長その他の機関を含む。）が行う工事整備対象設備等の工事又は整備に関する講習の制度について、消防法令上、正しいものは次のうちどれか。","ch":["消防設備士は、その業務に従事することになった日以降における最初の4月1日から5年以内ごとに講習を受けなければならない。","消防設備士は、免状の交付を受けた日以降における最初の4月1日から5年以内ごとに講習を受けなければならない。","消防設備士は、その業務に従事することになった日以降における最初の4月1日から2年以内に講習を受け、その後、前回の講習を受けた日以降における最初の4月1日から5年以内ごとに講習を受けなければならない。","消防設備士は、免状の交付を受けた日以降における最初の4月1日から2年以内に講習を受け、その後、前回の講習を受けた日以降における最初の4月1日から5年以内ごとに講習を受けなければならない。"],"ans":[4],"exp":"講習は、免状の交付を受けた日→最初の4月1日から2年以内に受講（1回目）→受講日以降の最初の4月1日から5年以内に受講（2回目以降）、というスケジュールになっている。"},
{"id":"s1-18-4","sec":"18. 消防設備士の講習","star":0,"q":"工事整備対象設備等の工事又は整備に関する講習についての記述のうち、文中の（　）に当てはまる語句の組合せとして、消防法令上、正しいものは次のうちどれか。\n「消防設備士は、（ ア ）日以降における最初の4月1日から（ イ ）以内に講習を受けなければならない。」","ch":["（ア）工事整備対象設備等の工事又は整備に従事することとなった ／ （イ）2年","（ア）免状の交付を受けた ／ （イ）5年","（ア）工事整備対象設備等の工事又は整備に従事することとなった ／ （イ）5年","（ア）免状の交付を受けた ／ （イ）2年"],"ans":[4],"exp":"「消防設備士は、〈免状の交付を受けた〉日以降における最初の4月1日から〈2年〉以内に講習を受けなければならない。」"},
{"id":"s1-18-5","sec":"18. 消防設備士の講習","star":1,"q":"都道府県知事（総務大臣が指定する市町村長その他の機関を含む。）が行う工事整備対象設備等の工事又は整備に関する講習の受講時期について、消防法令で定められているものは、次のうちどれか。","ch":["免状の交付を受けた日から2年以内、その後、前回の講習を受けた日から5年以内ごと","免状の交付を受けた日以降における最初の4月1日から1年以内、その後、前回の講習を受けた日以降における最初の4月1日から3年以内ごと","免状の交付を受けた日以降における最初の4月1日から2年以内、その後、前回の講習を受けた日以降における最初の4月1日から5年以内ごと","免状の交付を受けた日以降における最初の4月1日から5年以内、その後、前回の講習を受けた日以降における最初の4月1日から2年以内ごと","免状の交付を受けた日から3年以内ごと","免状の交付を受けた日から5年以内ごと"],"ans":[3],"exp":"受講期間のカウントは受講日や交付日そのものではなく、「免状の交付を受けた日（受講した日）以降における最初の4月1日から」起算する。初回は2年以内、2回目以降は5年以内ごととなる。"},
{"id":"s1-19-1","sec":"19. 消防設備士の義務","star":1,"q":"消防設備士の義務について、消防法令上、誤っているものは次のうちどれか。","ch":["消防用設備等が設備等技術基準に違反して設置又は維持されている場合、消防設備士は消防長又は消防署長に届け出なければならない。","消防設備士は、その業務に従事する場合、消防設備士免状を携帯していなければならない。","消防設備士は、業務を誠実に行い工事整備対象設備等の質の向上に努めなければならない。","消防設備士は、都道府県知事（総務大臣が指定する市町村長その他の機関を含む。）が行う工事整備対象設備等の工事又は整備に関する講習を受けなければならない。"],"ans":[1],"exp":"1. 消防法令にこのような規定はない。"},
{"id":"s1-20-1","sec":"20. 防火管理者","star":0,"q":"防火対象物の防火管理者に選任された者が行わなければならない業務として、消防法令に定められていないものは次のうちどれか。","ch":["消防計画の作成","火気の使用又は取扱いに関する監督","収容人員の管理","防火管理者の解任の届出"],"ans":[4],"exp":"4. 防火管理者の選任及び解任の届出は、東京都の場合、防火対象物の管理権原者が行うことになっている。規則第3条の2（防火管理者の選任又は解任の届出）では、選任又は解任の届出書の様式を定めている。"},
{"id":"s1-20-2","sec":"20. 防火管理者","star":0,"q":"次の消防法施行令別表第1に掲げる防火対象物のうち、消防法令上、防火管理者を定めなければならないものは次のうちどれか。","ch":["診療所（政令別表第1（6）項イ(4)に該当するもの）で、収容人員が20人のもの","美術館（政令別表第1（8）項に該当するもの）で、収容人員が20人のもの","教会（政令別表第1（11）項に該当するもの）で、収容人員が30人のもの","事務所（政令別表第1（15）項に該当するもの）で、収容人員が50人のもの"],"ans":[4],"exp":"1. 診療所は、特定防火対象物に該当するため、収容人員が30人以上の場合に防火管理者を定めなければならない。\n2〜4. 美術館、教会、事務所は、いずれも非特定防火対象物に該当するため、収容人員が50人以上の場合に防火管理者を定めなければならない。"},
{"id":"s1-20-3","sec":"20. 防火管理者","star":0,"q":"次の防火対象物のうち、防火管理者を定めなければならないものとして、消防法令上、正しいものの組合せはどれか。\nア. 飲食店（政令別表第1（3）項ロ）で、収容人員が20人のもの\nイ. 物品販売店舗（政令別表第1（4）項）で、収容人員が30人のもの\nウ. 事務所（政令別表第1（15）項）で、収容人員が40人のもの\nエ. 老人短期入所施設（政令別表第1（6）項ロ(1)）で、収容人員が10人のもの","ch":["ア、イ","ウ、エ","ア、ウ","イ、エ"],"ans":[4],"exp":"イ. 物品販売店舗は、特定防火対象物に該当するため、収容人員が30人以上の場合に防火管理者を定めなければならない。\nエ. 老人短期入所施設は、特定防火対象物（自力避難困難者入所施設）に該当するため、収容人員が10人以上の場合に防火管理者を定めなければならない。\n（※アの飲食店は30人未満のため不要、ウの事務所は50人未満のため不要）"},
{"id":"s1-20-4","sec":"20. 防火管理者","star":0,"q":"新築工事中の防火対象物において、防火管理者を選任しなければならないものは、次のうちどれか。ただし、建築物はすべて外壁及び床又は屋根を有する部分があり、電気工事等の工事中のものとし、収容人員が50人以上のものとする。","ch":["地階の床面積の合計が5,000㎡である建築物","地階を除く階数が5で、かつ、延べ面積が30,000㎡である建築物","地階を除く階数が11で、かつ、延べ面積が3,000㎡である建築物","地階の階数が4で、延べ面積が3,000㎡である建築物"],"ans":[1],"exp":"新築等の工事中の建築物で、収容人員が50人以上のもので防火管理者を定めなければならない基準は以下の通り。\nイ. 地階を除く階数が11以上で、かつ、延べ面積が10,000㎡以上である建築物\nロ. 延べ面積が50,000㎡以上である建築物\nハ. 地階の床面積の合計が5,000㎡以上である建築物"},
{"id":"s1-20-5","sec":"20. 防火管理者","star":0,"q":"防火管理に関する次の記述について、文中の（　）に当てはまる語句の組合せとして、消防法令上、正しいものはどれか。\n「（ ア ）は消防の用に供する設備、消防用水若しくは消火活動上必要な施設の（ イ ）及び整備又は火気の使用若しくは取扱いに関する監督を行うときは、火元責任者その他の防火管理の業務に従事する者に対し、必要な指示を与えなければならない。」","ch":["（ア）防火管理者 ／ （イ）工事","（ア）管理について権原を有する者 ／ （イ）工事","（ア）管理について権原を有する者 ／ （イ）点検","（ア）防火管理者 ／ （イ）点検"],"ans":[4],"exp":"防火管理者の責務（令第3条の2第1項〜4項）に関する規定。「防火管理者は、消防の用に供する設備、消防用水若しくは消火活動上必要な施設の〈点検〉及び整備又は火気の使用若しくは取扱いに関する監督を行うときは、火元責任者その他の防火管理の業務に従事する者に対し、必要な指示を与えなければならない。」"},
{"id":"s1-20-6","sec":"20. 防火管理者","star":1,"q":"次の消防法施行令別表第1に掲げる防火対象物のうち、消防法令上、防火管理者を定めなくてもよいものを、次のうちから4つ答えなさい。","ch":["老人短期入所施設で、収容人員が10人のもの","老人短期入所施設で、収容人員が20人のもの","飲食店で、収容人員が20人のもの","集会場で、収容人員が30人のもの","旅館で、収容人員が30人のもの","物品販売店舗で、収容人員が30人のもの","カラオケボックスで、収容人員が30人のもの","共同住宅で、収容人員が40人のもの","共同住宅で、収容人員が45人のもの","図書館で、収容人員が50人のもの","事務所で、収容人員が50人のもの","事務所で、収容人員が40人のもの"],"ans":[3,8,9,12],"exp":"1＆2. 老人短期入所施設は収容人員が10人以上の場合に、防火管理者を定めなければならない。\n3〜7. 飲食店、集会場、旅館、物品販売店舗、カラオケボックスは特定防火対象物に該当するため、収容人員が30人以上の場合に防火管理者を定めなければならない。\n8〜12. 共同住宅、図書館、事務所は、非特定防火対象物に該当するため、収容人員が50人以上の場合に防火管理者を定めなければならない。\n（※定めなくてもよいものは、飲食店20人の「3」、共同住宅40人の「8」、共同住宅45人の「9」、事務所40人の「12」となる）","multi":1},
{"id":"s1-20-7","sec":"20. 防火管理者","star":0,"q":"次の管理について権原が分かれている防火対象物のうち、統轄防火管理者を定めなければならないものとして、消防法令上、誤っているものはどれか。ただし、防火対象物は、高層建築物（高さ31mを超える建築物）ではないものとする。","ch":["地階を除く階数が3の特別養護老人ホームで、収容人員が60人のもの","地階を除く階数が5の事務所で、収容人員が80人のもの","2階をカラオケボックスとして使用する地階を除く階数が3の複合用途防火対象物で、収容人員が50人のもの","地階を除く階数が5の病院で、収容人員が70人のもの"],"ans":[2],"exp":"1. この場合、階数が3以上で、収容人員が10人以上であるため、統轄防火管理者を定めなければならない。\n2. 誤り。この場合、特定防火対象物ではなく、さらに複合用途防火対象物でもないため、統轄防火管理者を定めなくてもよい。\n3. この場合、特定用途を含む複合用途防火対象物であり、収容人員が30人以上であるため、統轄防火管理者を定めなければならない。\n4. この場合、特定防火対象物であり、階数が3以上で収容人員が30人以上であるため、統轄防火管理者を定めなければならない。"},
{"id":"s1-20-8","sec":"20. 防火管理者","star":0,"q":"次のアからウまでの管理について権原が分かれている防火対象物のうち、統轄防火管理者を定めなければならないものとして、消防法令上、正しいものの組合せは次のうちどれか。ただし、防火対象物は、高層建築物（高さ31mを超える建築物）ではないものとする。\nア. 地階を除く階数が5の作業場で、収容人員が80人のもの\nイ. 地階を除く階数が4の病院で、収容人員が40人のもの\nウ. 地階を除く階数が3の特別養護老人ホームで、収容人員が20人のもの","ch":["ア、イのみ","ア、ウのみ","イ、ウのみ","ア、イ、ウすべて"],"ans":[3],"exp":"ア. この場合、特定防火対象物ではなく、さらに複合用途防火対象物でもないため、統轄防火管理者を定めなくてもよい。\nイ. この場合、特定防火対象物であり、階数が3以上で収容人員が30人以上であるため、統轄防火管理者を定めなければならない。\nウ. この場合、階数が3以上で、収容人員が10人以上であるため、統轄防火管理者を定めなければならない。"},
{"id":"s1-20-9","sec":"20. 防火管理者","star":1,"q":"管理について権原が分かれている防火対象物のうち、統轄防火管理者を定めなければならないものとして、消防法令上、誤っているものは次のうちどれか。なお、高層建築物とは、高さ31mを超える建築物をいう。","ch":["高層建築物に該当しない地階を除く階数が5のホテルで、収容人員が45人のもの","高層建築物に該当しない地階を除く階数が3の飲食店で、収容人員が60人のもの","高層建築物に該当しない地階を除く階数が7の事務所ビルで、収容人員が80人のもの","高層建築物に該当する地階を除く階数が13の共同住宅で、収容人員が40人のもの"],"ans":[3],"exp":"1＆2. 地階を除く階数が3以上で、収容人員が30人以上のため、統轄防火管理者を定めなければならない。\n3. 誤り。特定防火対象物に該当しない事務所ビルは対象外である。\n4. 高層建築物（高さ31m超）に該当するため、統轄防火管理者を定めなければならない。"},
{"id":"s1-21-1","sec":"21. 検定制度","star":0,"q":"消防の用に供する機械器具等の検定に関する次の記述のうち、消防法令上、正しいものの組合せはどれか。\nア. 検定対象機械器具等は、型式承認を受けたものであり、かつ、型式適合検定に合格したものである旨の表示が付されているものでなければ、販売の目的で陳列してはならない。\nイ. 検定対象機械器具等は、型式承認を受けたものであり、かつ、型式適合検定に合格したものである旨の表示が付されているものでなければ、販売してはならない。\nウ. 検定対象機械器具等のうち消防の用に供する機械器具又は設備は、型式承認を受けたものであり、かつ、型式適合検定に合格したものである旨の表示が付されているものでなければ、その設置の請負に係る工事に使用してはならない。","ch":["ア、イのみ","ア、ウのみ","イ、ウのみ","ア、イ、ウすべて"],"ans":[4],"exp":""},
{"id":"s1-21-2","sec":"21. 検定制度","star":1,"q":"検定対象機械器具等の型式承認に関する記述について、文中の（　）に当てはまる語句の組み合わせとして、消防法令上、正しいものは次のうちどれか。\n「型式承認とは、検定対象機械器具等の型式に係る（ ア ）が総務省令で定める検定対象機械器具等に係る技術上の（ イ ）に適合している旨の承認をいう。」","ch":["（ア）要件等 ／ （イ）性能","（ア）要件等 ／ （イ）規格","（ア）形状等 ／ （イ）性能","（ア）形状等 ／ （イ）規格"],"ans":[4],"exp":""},

/* ===================== 状態管理 ===================== */
const LS_PROG="shobo4rui_progress_v3", LS_EXTRA="shobo4rui_extra_v3";
const __SEED_PROG = {}; /* 完全版HTML書き出し時、ここに学習履歴のスナップショットが焼き込まれます */
function loadProg(){
  try{
    const raw = localStorage.getItem(LS_PROG);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  try{ return __SEED_PROG && Object.keys(__SEED_PROG).length ? JSON.parse(JSON.stringify(__SEED_PROG)) : {}; }catch(e){ return {}; }
}
function saveProg(){try{localStorage.setItem(LS_PROG,JSON.stringify(prog));}catch(e){}}
function loadExtra(){try{return JSON.parse(localStorage.getItem(LS_EXTRA)||"[]");}catch(e){return [];}}
function saveExtra(){try{localStorage.setItem(LS_EXTRA,JSON.stringify(extra));}catch(e){}}

let prog = loadProg();
let extra = loadExtra();
function ALL(){const m=new Map(DATA.map(d=>[d.id,d]));extra.forEach(d=>m.set(d.id,d));return [...m.values()];}
function SECTIONS(){const s=[];ALL().forEach(d=>{if(!s.includes(d.sec))s.push(d.sec);});return s;}

function tierOf(item){
  const p=prog[item.id]||{seen:0,wrong:0,streak:0};
  if(p.wrong>=2) return "weak";
  if(!p.seen) return "new";
  if(item.star) return "hold";
  if(p.streak>=3) return "stable";
  return "normal";
}
function poolByTier(t){return ALL().filter(d=>tierOf(d)===t);}
function poolFlagged(){return ALL().filter(d=> prog[d.id] && prog[d.id].flagged);}
function toggleUnderstand(id){
  const p = prog[id] || {seen:0,wrong:0,streak:0};

}

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* セッション */
let S = null; // {queue, idx, mode, timeLeft, timerId, correct, wrongIds, selected, answered, missDetail}

function startSession(pool, mode){
  if(!pool.length){alert("この条件に該当する問題がありません。");return;}
  S = {queue:shuffle(pool), idx:0, mode:mode, correct:0, wrongIds:[], selected:[], answered:false, answers:{}, sessionStreak:0,
       timeLeft: mode==="mock" ? Math.max(600, pool.length*45) : null, timerId:null};
  if(mode==="mock"){
    S.timerId = setInterval(()=>{
      S.timeLeft--; 
      if(S.timeLeft<=0){clearInterval(S.timerId); finishSession();}
      else{ const t=document.getElementById("timerNum"); if(t) t.textContent=fmtTime(S.timeLeft); 
            if(S.timeLeft<60){const tw=document.getElementById("timerBox"); if(tw) tw.classList.add("warn");} }
    },1000);
  }
  view = "quiz";
  render();
}
function fmtTime(sec){const m=Math.floor(sec/60),s=sec%60;return m+":"+String(s).padStart(2,"0");}

function currentQ(){return S.queue[S.idx];}

function toggleChoice(n){
  const q=currentQ();
  if(S.mode==="mock"){
    if(q.multi){
      const i=S.selected.indexOf(n);
      if(i>=0) S.selected.splice(i,1); else S.selected.push(n);
    } else {
      S.selected=[n];
    }
    render();
    return;
  }
  if(S.answered) return;
  if(q.multi){
    const i=S.selected.indexOf(n);
    if(i>=0) S.selected.splice(i,1); else S.selected.push(n);
    render();
  } else {
    S.selected=[n];
    lockAnswer();
  }
}
function lockAnswer(){
  const q=currentQ();
  if(S.answered || S.selected.length===0) return;
  S.answered=true;
  const correct = arraysEqual(S.selected.slice().sort(),q.ans.slice().sort());
  gradeQuestion(q.id, correct);
  if(correct){ S.correct++; S.sessionStreak=(S.sessionStreak||0)+1; }
  else { S.wrongIds.push(q.id); S.sessionStreak=0; }
  render();
}
function gradeQuestion(id, correct){
  const p = prog[id] || {seen:0,wrong:0,streak:0};
  p.seen=(p.seen||0)+1;
  if(correct){
    p.streak=(p.streak||0)+1;
    if(p.streak>=3 && p.wrong>0){ p.wrong=Math.max(0,p.wrong-1); p.streak=0; }
  } else {
    p.wrong=(p.wrong||0)+1; p.streak=0;
  }
  prog[id]=p; saveProg();
}
function arraysEqual(a,b){return a.length===b.length && a.every((v,i)=>v===b[i]);}

/* 他のAIに聞く用テキスト生成 & コピー */
function buildPromptText(item){
  const chLines = item.ch.map((c,i)=>(i+1)+". "+c).join("\n");
  const ansLines = item.ans.map(n=>n+". "+(item.ch[n-1]||"")).join(" / ");
  return "【消防設備士 甲種4類・消防法令 確認依頼】\n"
    + "以下の問題について、アプリ側の正解・解説が消防法令上正しいか、詳しく解説してください。誤りがあれば指摘してください。\n\n"
    + "■ 出題範囲：" + item.sec + "\n\n"
    + "■ 問題\n" + item.q + "\n\n"
    + "■ 選択肢\n" + chLines + "\n\n"
    + "■ このアプリ上の正解\n" + ansLines + "\n\n"
    + "■ このアプリの解説\n" + (item.exp || "（解説なし）");
}
function fallbackCopy(text){
  try{
    const ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.top="0"; ta.style.left="0"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return !!ok;
  }catch(e){ return false; }
}
function copyText(text, btnId){
  const flash = (ok)=>{
    if(!btnId) return;
    const el=document.getElementById(btnId);
    if(el && !el.dataset.orig){
      el.dataset.orig = el.textContent;
      el.textContent = ok ? "コピーしました ✓" : "コピー失敗（手動で選択してください）";
      setTimeout(()=>{ if(el.dataset.orig!==undefined){ el.textContent = el.dataset.orig; delete el.dataset.orig; } }, 2200);
    }
  };
  let usedModern = false;
  try{
    if(typeof navigator !== "undefined" && navigator.clipboard && navigator.clipboard.writeText){
      usedModern = true;
      navigator.clipboard.writeText(text).then(()=>flash(true)).catch(()=>{ flash(fallbackCopy(text)); });
    }
  }catch(e){ usedModern = false; }
  if(!usedModern){
    flash(fallbackCopy(text));
  }
}
function copyQuestion(id, btnId){
  const it = ALL().find(d=>d.id===id); if(!it) return;
  const text = buildPromptText(it);
  copyText(text, btnId);
  revealCopyBox(text, btnId);
}
function revealCopyBox(text, anchorId){
  try{
    const old = document.getElementById("copyRevealBox");
    if(old) old.remove();
    const anchor = document.getElementById(anchorId);
    if(!anchor) return;
    const box = document.createElement("div");
    box.id = "copyRevealBox";
    box.className = "copyRevealBox";
    const label = document.createElement("div");
    label.className = "copyRevealLabel";
    label.textContent = "自動コピーがうまくいかない場合：下の枠は選択済みです。そのままコピー操作（Ctrl/⌘+C、またはタップして「コピー」）をしてください。";
    const ta = document.createElement("textarea");
    ta.readOnly = true;
    ta.value = text;
    ta.className = "copyRevealTa";
    box.appendChild(label);
    box.appendChild(ta);
    anchor.insertAdjacentElement("afterend", box);
    ta.focus();
    ta.select();
    try{ ta.setSelectionRange(0, text.length); }catch(e){}
  }catch(e){}
}
function tryCopyForAI(id){
  try{
    const it = ALL().find(d=>d.id===id); if(!it) return;
    copyText(buildPromptText(it), null);
  }catch(e){}
}

/* モチベーション文言 */
function encourageText(correct, streak){
  if(correct){
    if(streak>=5) return streak+"問連続正解！絶好調です🔥";
    if(streak>=3) return streak+"問連続正解！いい調子👍";
    const pool=["よくできました！","正解です、さすが！","ばっちりです！","その調子！","覚えてきていますね！"];
    return pool[Math.floor(Math.random()*pool.length)];
  } else {
    const pool=["おしい、次はいける！","ここが伸びしろです","大丈夫、次で取り返そう","一つずつ潰していこう","解説を読んで次に活かそう"];
    return pool[Math.floor(Math.random()*pool.length)];
  }
}

function mockAdvance(){
  const q=currentQ();
  if(S.selected.length===0) return;
  S.answers[q.id]=S.selected.slice();
  nextQ();
}
function nextQ(){
  S.answered=false; S.selected=[];
  if(S.idx < S.queue.length-1){ S.idx++; render(); }
  else{ finishSession(); }
}
function finishSession(){
  if(S.timerId) clearInterval(S.timerId);
  if(S.mode==="mock"){
    S.correct=0; S.wrongIds=[];
    S.queue.forEach(q=>{
      const sel = S.answers[q.id] || [];
      const correct = sel.length>0 && arraysEqual(sel.slice().sort(),q.ans.slice().sort());
      gradeQuestion(q.id, correct);
      if(correct) S.correct++; else S.wrongIds.push(q.id);
    });
  }
  S.done=true; render();
}
function retryWrong(){
  const items = S.wrongIds.map(id=>ALL().find(d=>d.id===id)).filter(Boolean);
  startSession(items, "practice");
}
function backHome(){ 
  if(S && S.timerId) clearInterval(S.timerId); 
  S=null; 
  view="home"; 
  render(); 
}

/* インポート */
function doImport(txt){
  try{
    const add = JSON.parse(txt);
    if(!Array.isArray(add)) throw new Error("配列形式で入力してください");
    const m = new Map(extra.map(d=>[d.id,d]));
    add.forEach(d=>{ if(d && d.id) m.set(d.id,d); });
    extra = [...m.values()];
    saveExtra();
    alert(add.length+"件を取り込みました（合計拡張分:"+extra.length+"件）");
    view="home"; render();
  }catch(e){ alert("JSON読み込みエラー: "+e.message); }
}

/* 完全版HTMLの書き出し（追加分＋学習履歴をまとめて焼き込んで単一ファイル化） */
function exportMergedHtml(){
  try{
    if(!__SELF_SRC){ alert("この環境では書き出しに対応していません（スクリプトソースを取得できませんでした）。"); return; }
    const merged = ALL();
    let src = __SELF_SRC;
    src = src.replace(/const DATA = \[[\s\S]*?\n\];/, "const DATA = " + JSON.stringify(merged) + ";");
    src = src.replace(/let extra = loadExtra\(\);/, "let extra = [];");
    src = src.replace(/const __SEED_PROG = \{\};/, "const __SEED_PROG = " + JSON.stringify(prog) + ";");
    const headHtml = document.head.outerHTML;
    const full = "<!DOCTYPE html>\n<html lang=\"ja\">\n" + headHtml + "\n<body>\n<div id=\"app\"></div>\n<script>\n" + src + "\n<\/script>\n</body>\n</html>";
    const blob = new Blob([full], {type:"text/html"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "shobo4_quiz_merged.html";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){ alert("書き出しエラー: "+e.message); }
}

  <p class="refnote">覚え方：「一回きりの届出・検査は間口を広く（300㎡）、毎年ずっと続く有資格者点検はハードルを高く（1,000㎡）」。特に非特定防火対象物側の基準を300と1,000で取り違えないこと。</p>

  <div class="refhead">④ 既存防火対象物の増改築・修繕（基準適合の義務が生じる規模）</div>
  <table class="reftable">
    <tr><th>行為</th><th>基準</th></tr>
    <tr><td>増築・改築</td><td>増築（改築）部分が<b>1,000㎡以上</b>、または工事着手時の延べ面積の<b>1/2以上</b></td></tr>
    <tr><td>大規模の修繕・模様替え</td><td>主要構造部である<b>壁</b>について<b>過半（1/2超）</b>の修繕・模様替え</td></tr>
  </table>
  <p class="refnote">選択肢では「1/3」という数字がよく紛れ込みますが、実際の基準は常に「1/2」です。</p>

  <div class="refhead">⑤ おまけ：防火管理者の選任基準（人数）</div>
  <table class="reftable">
    <tr><th>防火対象物の区分</th><th>選任が必要な収容人員</th></tr>
    <tr><td>自力避難困難者入所施設等<br>（老人短期入所施設等）</td><td><b>10人</b>以上</td></tr>
    <tr><td>特定防火対象物</td><td><b>30人</b>以上</td></tr>
    <tr><td>特定防火対象物以外</td><td><b>50人</b>以上</td></tr>
  </table>
  <p class="refnote">統括防火管理者は、上記の人数条件に加えて「地階を除く階数3以上」が必要です（高層建築物＝高さ31m超なら人数・階数問わず無条件で必要）。</p>
  `;
}
function renderStats(){
  const all=ALL();
  const answered = all.filter(d=>prog[d.id]&&prog[d.id].seen);
  const totalSeen = answered.reduce((s,d)=>s+prog[d.id].seen,0);
  const totalWrong = answered.reduce((s,d)=>s+(prog[d.id].wrong||0),0);
  const acc = totalSeen ? Math.round((totalSeen-totalWrong)/totalSeen*100) : 0;
  const secs = SECTIONS();
  const secRows = secs.map(sec=>{
    const items = all.filter(d=>d.sec===sec);
    const done = items.filter(d=>prog[d.id]&&prog[d.id].seen).length;
    const pct = items.length ? Math.round(done/items.length*100) : 0;
    return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;">
      <span>${esc(sec)}</span><span class="count-mono">${done}/${items.length}</span></div>
      <div class="statbar"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
  const flagged = poolFlagged();
  const flagSecCount = {};
  flagged.forEach(d=>{ flagSecCount[d.sec] = (flagSecCount[d.sec]||0)+1; });
  const flagSummary = Object.entries(flagSecCount).sort((a,b)=>b[1]-a[1])
    .map(([sec,n])=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line);"><span>${esc(sec)}</span><span class="count-mono">${n}問</span></div>`).join("");
  const flagList = flagged.length ? `<div class="misslist">` + flagged.map(it=>{
    return `<div class="missitem" onclick='reviewOne(${JSON.stringify(it.id)})'>
      <div class="m1">${esc(it.sec)}</div>${esc(it.q.split("\\n")[0])}</div>`;
  }).join("") + `</div>` : `<p class="sub">「よくわかっていない」マークを付けた問題はまだありません。解答後の画面にあるボタンから追加できます。</p>`;
  return `<span class="backlink" onclick="view='home';render()">← ホームへ戻る</span>
  <h1>進捗統計</h1>
  <div class="resultscore" style="padding:10px 0 20px">
    <div class="num">${acc}<small>%</small></div>
    <div class="cap">延べ解答 ${totalSeen}回中 正答 ${totalSeen-totalWrong}回</div>
  </div>
  <h2>単元別 着手率</h2>
  ${secRows}
  <div class="refhead">🤔 よくわかっていない問題（${flagged.length}問）</div>
  ${flagSummary ? `<div style="margin-bottom:14px">${flagSummary}</div>` : ""}
  ${flagList}
  ${flagged.length ? `<button class="btn ghost" style="margin-top:4px" onclick="startSession(poolFlagged(),'practice')">この${flagged.length}問だけまとめて復習する</button>` : ""}
  <button class="btn line" style="margin-top:16px" onclick="if(confirm('全ての学習履歴をリセットします。よろしいですか？')){prog={};saveProg();render();}">履歴をリセット</button>
  `;
}

render();
</script>
</body>
